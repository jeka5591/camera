<body>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>

<div id="menu">

    <button id="drawButton" class="active">
        ✏️ Рисование
    </button>

    <button id="objectButton">
        ⬛ Объект
    </button>

    <button id="clearButton">
        🗑 Очистить
    </button>

</div>

<div id="status">
    Режим: ✏️ Рисование
</div>

<div id="fps">
    FPS: --
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>


<script>

/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const drawButton =
    document.getElementById("drawButton");

const objectButton =
    document.getElementById("objectButton");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");

const fpsText =
    document.getElementById("fps");


/* =====================================================
   РАЗМЕР
===================================================== */

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;

}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   РИСОВАНИЕ
===================================================== */

const drawingCanvas =
    document.createElement("canvas");

const drawingCtx =
    drawingCanvas.getContext("2d");

drawingCanvas.width = W;
drawingCanvas.height = H;

window.addEventListener(
    "resize",
    () => {

        drawingCanvas.width = W;
        drawingCanvas.height = H;

    }
);


let lastDrawPoint = null;


function drawLine(x, y) {

    if (!lastDrawPoint) {

        lastDrawPoint = {
            x,
            y
        };

        return;
    }

    drawingCtx.beginPath();

    drawingCtx.moveTo(
        lastDrawPoint.x,
        lastDrawPoint.y
    );

    drawingCtx.lineTo(
        x,
        y
    );

    drawingCtx.strokeStyle =
        "#00ffcc";

    drawingCtx.lineWidth = 6;

    drawingCtx.lineCap =
        "round";

    drawingCtx.lineJoin =
        "round";

    drawingCtx.stroke();

    lastDrawPoint = {
        x,
        y
    };
}


/* =====================================================
   РЕЖИМ
===================================================== */

let mode = "draw";


drawButton.onclick = () => {

    mode = "draw";

    drawButton.classList.add("active");
    objectButton.classList.remove("active");

    status.textContent =
        "Режим: ✏️ Рисование";

    resetGrab();

};


objectButton.onclick = () => {

    mode = "object";

    objectButton.classList.add("active");
    drawButton.classList.remove("active");

    status.textContent =
        "Режим: ⬛ Объект — 🤏 схвати угол двумя пальцами";

    lastDrawPoint = null;

};


clearButton.onclick = () => {

    drawingCtx.clearRect(
        0,
        0,
        W,
        H
    );

};


/* =====================================================
   ОБЪЕКТ
===================================================== */

let object = {

    x: W / 2 - 150,

    y: H / 2 - 100,

    width: 300,

    height: 200

};


/*
   Минимальный размер
*/

const MIN_SIZE = 60;


/* =====================================================
   РУКИ
===================================================== */

let detectedHands = [];

let processing = false;

let lastProcessTime = 0;

const PROCESS_INTERVAL = 33;


/* =====================================================
   ПРЕОБРАЗОВАНИЕ КООРДИНАТ
===================================================== */

function screenPoint(point) {

    return {

        x: (1 - point.x) * W,

        y: point.y * H

    };

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
    new Hands({

        locateFile: file => {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


hands.setOptions({

    /*
     * Две руки нужны для
     * одновременного изменения
     * двух углов.
     */

    maxNumHands: 2,

    /*
     * 1 = полная модель руки.
     */

    modelComplexity: 1,

    minDetectionConfidence: 0.6,

    minTrackingConfidence: 0.6

});


/* =====================================================
   РЕЗУЛЬТАТ MEDIAPIPE
===================================================== */

hands.onResults(results => {

    detectedHands = [];

    if (
        !results.multiHandLandmarks
    ) {

        return;

    }


    for (
        let i = 0;
        i < results.multiHandLandmarks.length;
        i++
    ) {

        const landmarks =
            results.multiHandLandmarks[i];


        const index =
            screenPoint(landmarks[8]);

        const thumb =
            screenPoint(landmarks[4]);

        const indexPIP =
            screenPoint(landmarks[6]);


        /*
         * Полная модель руки
         */

        detectedHands.push({

            landmarks,

            index,

            thumb,

            indexPIP,

            pinching: false,

            pinchPoint: {

                x: (index.x + thumb.x) / 2,

                y: (index.y + thumb.y) / 2

            }

        });

    }

});


/* =====================================================
   PINCH
===================================================== */

function updatePinches() {

    for (
        const hand of detectedHands
    ) {

        const d =
            distance(
                hand.index,
                hand.thumb
            );


        /*
         * Большой и указательный
         * пальцы соприкасаются.
         */

        hand.pinching =
            d < 45;


        hand.pinchPoint = {

            x:
                (hand.index.x +
                 hand.thumb.x) / 2,

            y:
                (hand.index.y +
                 hand.thumb.y) / 2

        };

    }

}


/* =====================================================
   РАССТОЯНИЕ
===================================================== */

function distance(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    return Math.sqrt(
        dx * dx +
        dy * dy
    );

}


/* =====================================================
   УГЛЫ ОБЪЕКТА
===================================================== */

function getCorners() {

    return {

        tl: {
            x: object.x,
            y: object.y
        },

        tr: {
            x:
                object.x +
                object.width,

            y:
                object.y
        },

        bl: {
            x:
                object.x,

            y:
                object.y +
                object.height
        },

        br: {
            x:
                object.x +
                object.width,

            y:
                object.y +
                object.height
        }

    };

}


/* =====================================================
   ОПРЕДЕЛЕНИЕ УГЛА
===================================================== */

function nearestCorner(point) {

    const corners =
        getCorners();

    let closest = null;

    let closestDistance = 999999;


    for (
        const name in corners
    ) {

        const d =
            distance(
                point,
                corners[name]
            );


        if (
            d < closestDistance
        ) {

            closestDistance = d;

            closest = name;

        }

    }


    if (
        closestDistance < 65
    ) {

        return closest;

    }


    return null;

}


/* =====================================================
   ПРОВЕРКА ВНУТРИ ОБЪЕКТА
===================================================== */

function insideObject(point) {

    return (

        point.x >= object.x &&

        point.x <=
            object.x +
            object.width &&

        point.y >= object.y &&

        point.y <=
            object.y +
            object.height

    );

}


/* =====================================================
   УПРАВЛЕНИЕ
===================================================== */

let grabbed = [];


/*
   grabbed:

   {
       handIndex,
       type,
       corner,
       startPoint,
       startObject
   }
*/


function resetGrab() {

    grabbed = [];

}


/* =====================================================
   НАЧАЛО ЗАХВАТА
===================================================== */

function startGrab() {

    grabbed = [];


    for (
        let i = 0;
        i < detectedHands.length;
        i++
    ) {

        const hand =
            detectedHands[i];


        if (!hand.pinching) {

            continue;

        }


        const point =
            hand.pinchPoint;


        const corner =
            nearestCorner(point);


        /*
         * Сначала проверяем угол.
         */

        if (corner) {

            grabbed.push({

                handIndex: i,

                type: "resize",

                corner,

                startPoint: {
                    x: point.x,
                    y: point.y
                },

                startObject: {
                    x: object.x,
                    y: object.y,
                    width: object.width,
                    height: object.height
                }

            });

            continue;

        }


        /*
         * Если угол не выбран,
         * можно схватить объект
         * внутри и двигать его.
         */

        if (
            insideObject(point)
        ) {

            grabbed.push({

                handIndex: i,

                type: "move",

                startPoint: {
                    x: point.x,
                    y: point.y
                },

                startObject: {
                    x: object.x,
                    y: object.y,
                    width: object.width,
                    height: object.height
                }

            });

        }

    }

}


/* =====================================================
   ОБНОВЛЕНИЕ ЗАХВАТА
===================================================== */

function updateGrab() {

    if (
        grabbed.length === 0
    ) {

        return;

    }


    /*
     * Одна рука
     */

    if (
        grabbed.length === 1
    ) {

        const g =
            grabbed[0];

        const hand =
            detectedHands[g.handIndex];


        if (
            !hand ||
            !hand.pinching
        ) {

            resetGrab();

            return;

        }


        const p =
            hand.pinchPoint;


        /*
         * ДВИЖЕНИЕ
         */

        if (
            g.type === "move"
        ) {

            const dx =
                p.x -
                g.startPoint.x;

            const dy =
                p.y -
                g.startPoint.y;


            object.x =
                g.startObject.x + dx;

            object.y =
                g.startObject.y + dy;

            return;

        }


        /*
         * ИЗМЕНЕНИЕ РАЗМЕРА
         */

        if (
            g.type === "resize"
        ) {

            resizeFromCorner(
                g.corner,
                p,
                g.startObject
            );

        }

    }


    /*
     * ДВЕ РУКИ
     */

    if (
        grabbed.length >= 2
    ) {

        const g1 =
            grabbed[0];

        const g2 =
            grabbed[1];


        const h1 =
            detectedHands[g1.handIndex];

        const h2 =
            detectedHands[g2.handIndex];


        if (
            !h1 ||
            !h2 ||
            !h1.pinching ||
            !h2.pinching
        ) {

            resetGrab();

            return;

        }


        /*
         * Если обе руки схватили углы,
         * строим новый прямоугольник
         * между ними.
         */

        if (
            g1.type === "resize" &&
            g2.type === "resize"
        ) {

            const p1 =
                h1.pinchPoint;

            const p2 =
                h2.pinchPoint;


            updateTwoCorners(
                g1.corner,
                p1,
                g2.corner,
                p2
            );

        }

    }

}


/* =====================================================
   ИЗМЕНЕНИЕ ОДНИМ УГЛОМ
===================================================== */

function resizeFromCorner(
    corner,
    point,
    start
) {

    let left =
        start.x;

    let right =
        start.x +
        start.width;

    let top =
        start.y;

    let bottom =
        start.y +
        start.height;


    if (
        corner === "tl"
    ) {

        left = point.x;
        top = point.y;

    }


    if (
        corner === "tr"
    ) {

        right = point.x;
        top = point.y;

    }


    if (
        corner === "bl"
    ) {

        left = point.x;
        bottom = point.y;

    }


    if (
        corner === "br"
    ) {

        right = point.x;
        bottom = point.y;

    }


    /*
     * Не даём перевернуть
     * объект.
     */

    if (
        right - left <
        MIN_SIZE
    ) {

        if (
            corner === "tl" ||
            corner === "bl"
        ) {

            left =
                right -
                MIN_SIZE;

        } else {

            right =
                left +
                MIN_SIZE;

        }

    }


    if (
        bottom - top <
        MIN_SIZE
    ) {

        if (
            corner === "tl" ||
            corner === "tr"
        ) {

            top =
                bottom -
                MIN_SIZE;

        } else {

            bottom =
                top +
                MIN_SIZE;

        }

    }


    object.x =
        left;

    object.y =
        top;

    object.width =
        right - left;

    object.height =
        bottom - top;

}


/* =====================================================
   ДВА УГЛА
===================================================== */

function updateTwoCorners(
    corner1,
    point1,
    corner2,
    point2
) {

    let left = object.x;

    let right =
        object.x +
        object.width;

    let top = object.y;

    let bottom =
        object.y +
        object.height;


    /*
     * Каждый захваченный угол
     * устанавливаем в положение пальца.
     */

    const points = {};


    points[corner1] =
        point1;

    points[corner2] =
        point2;


    /*
     * Определяем крайние координаты
     * независимо по X и Y.
     */

    const allPoints = [
        point1,
        point2
    ];


    left =
        Math.min(
            allPoints[0].x,
            allPoints[1].x
        );

    right =
        Math.max(
            allPoints[0].x,
            allPoints[1].x
        );

    top =
        Math.min(
            allPoints[0].y,
            allPoints[1].y
        );

    bottom =
        Math.max(
            allPoints[0].y,
            allPoints[1].y
        );


    /*
     * Минимальная ширина.
     */

    if (
        right - left <
        MIN_SIZE
    ) {

        right =
            left +
            MIN_SIZE;

    }


    /*
     * Минимальная высота.
     */

    if (
        bottom - top <
        MIN_SIZE
    ) {

        bottom =
            top +
            MIN_SIZE;

    }


    object.x =
        left;

    object.y =
        top;

    object.width =
        right - left;

    object.height =
        bottom - top;

}


/* =====================================================
   ОТРИСОВКА
===================================================== */

function render() {

    requestAnimationFrame(
        render
    );


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
     * Рисунок
     */

    ctx.drawImage(
        drawingCanvas,
        0,
        0
    );


    /*
     * Руки
     */

    renderHands();


    /*
     * Режим объекта
     */

    if (
        mode === "object"
    ) {

        renderObject();

    }


    /*
     * Рисование
     */

    if (
        mode === "draw"
    ) {

        renderDrawing();

    }

}


requestAnimationFrame(
    render
);


/* =====================================================
   ПОЛНАЯ МОДЕЛЬ РУКИ
===================================================== */

function renderHands() {

    /*
     * MediaPipe drawing_utils
     * работает с canvas.
     *
     * Поэтому передаём зеркальные
     * координаты вручную.
     */

    for (
        const hand of detectedHands
    ) {

        const mirrored =
            hand.landmarks.map(
                point => {

                    return {

                        x: 1 - point.x,

                        y: point.y,

                        z: point.z

                    };

                }
            );


        /*
         * Соединения пальцев.
         */

        drawConnectors(
            ctx,
            mirrored,
            HAND_CONNECTIONS,
            {
                color: "#00ff88",
                lineWidth: 3
            }
        );


        /*
         * 21 точка руки.
         */

        drawLandmarks(
            ctx,
            mirrored,
            {
                color: "#ffffff",
                lineWidth: 1,
                radius: 4
            }
        );


        /*
         * Если пальцы зажаты,
         * подсвечиваем место захвата.
         */

        if (
            hand.pinching
        ) {

            ctx.beginPath();

            ctx.arc(
                hand.pinchPoint.x,
                hand.pinchPoint.y,
                11,
                0,
                Math.PI * 2
            );

            ctx.fillStyle =
                "#00ffcc";

            ctx.fill();

        }

    }

}


/* =====================================================
   ОБЪЕКТ
===================================================== */

function renderObject() {

    ctx.save();


    /*
     * Свечение.
     */

    ctx.shadowColor =
        "#00ffcc";

    ctx.shadowBlur = 18;


    ctx.strokeStyle =
        "#00ffcc";

    ctx.lineWidth = 4;


    ctx.strokeRect(

        object.x,

        object.y,

        object.width,

        object.height

    );


    ctx.shadowBlur = 0;


    /*
     * Четыре угла.
     */

    const corners =
        getCorners();


    for (
        const name in corners
    ) {

        const p =
            corners[name];


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            14,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#ffffff";

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#00ffcc";

        ctx.fill();

    }


    ctx.restore();

}


/* =====================================================
   РИСОВАНИЕ
===================================================== */

function renderDrawing() {

    if (
        detectedHands.length === 0
    ) {

        lastDrawPoint = null;

        return;

    }


    const hand =
        detectedHands[0];


    /*
     * Указательный палец
     * должен быть вытянут.
     */

    const extended =
        hand.index.y <
        hand.indexPIP.y;


    /*
     * Не рисуем, если большой
     * палец слишком близко.
     */

    if (
        extended &&
        !hand.pinching
    ) {

        drawLine(
            hand.index.x,
            hand.index.y
        );


        /*
         * Курсор.
         */

        ctx.beginPath();

        ctx.arc(
            hand.index.x,
            hand.index.y,
            7,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            "#00ffcc";

        ctx.fill();

    } else {

        lastDrawPoint = null;

    }

}


/* =====================================================
   ОБРАБОТКА ЗАХВАТА
===================================================== */

let wasPinching = false;


function updateInteraction() {

    updatePinches();


    if (
        mode !== "object"
    ) {

        resetGrab();

        return;

    }


    const pinchingNow =
        detectedHands.some(
            h => h.pinching
        );


    /*
     * Только что начали хватать.
     */

    if (
        pinchingNow &&
        !wasPinching
    ) {

        startGrab();

    }


    /*
     * Продолжаем хват.
     */

    if (
        pinchingNow
    ) {

        updateGrab();

    }


    /*
     * Отпустили.
     */

    if (
        !pinchingNow
    ) {

        resetGrab();

    }


    wasPinching =
        pinchingNow;

}


/* =====================================================
   LOOP ВЗАИМОДЕЙСТВИЯ
===================================================== */

function interactionLoop() {

    updateInteraction();

    requestAnimationFrame(
        interactionLoop
    );

}

requestAnimationFrame(
    interactionLoop
);


/* =====================================================
   FPS
===================================================== */

let frames = 0;

let fpsStart =
    performance.now();


function fpsLoop(time) {

    frames++;


    if (
        time - fpsStart >= 1000
    ) {

        fpsText.textContent =
            "FPS: " + frames;

        frames = 0;

        fpsStart = time;

    }


    requestAnimationFrame(
        fpsLoop
    );

}

requestAnimationFrame(
    fpsLoop
);


/* =====================================================
   РАСПОЗНАВАНИЕ
===================================================== */

async function processHands(time) {

    requestAnimationFrame(
        processHands
    );


    if (
        video.readyState < 2
    ) {

        return;

    }


    if (
        processing
    ) {

        return;

    }


    if (
        time - lastProcessTime <
        PROCESS_INTERVAL
    ) {

        return;

    }


    lastProcessTime =
        time;

    processing = true;


    try {

        await hands.send({
            image: video
        });

    } catch (error) {

        console.error(error);

    }


    processing = false;

}


requestAnimationFrame(
    processHands
);


/* =====================================================
   КАМЕРА
===================================================== */
