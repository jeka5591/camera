<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рисование пальцем в воздухе</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
    }

    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
    }

    video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      filter: brightness(1.05) contrast(1.05);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      pointer-events: none;
    }

    #status {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: 16px;
      font-weight: 500;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      z-index: 100;
      text-align: center;
      transition: opacity 0.3s;
      white-space: nowrap;
    }

    #status.hidden { opacity: 0; }
    #status .highlight { color: #7cff7c; font-weight: 700; }

    .controls {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 100;
    }

    .controls button {
      padding: 12px 24px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 40px;
      background: rgba(20, 20, 40, 0.75);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      backdrop-filter: blur(12px);
      transition: all 0.2s;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .controls button:hover {
      background: rgba(60, 60, 120, 0.9);
      transform: translateY(-2px);
    }

    .controls button.clear {
      background: rgba(220, 50, 50, 0.7);
    }

    .controls button.clear:hover {
      background: rgba(255, 60, 60, 0.9);
    }

    .draw-indicator {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #333;
      border: 2px solid rgba(255,255,255,0.3);
      z-index: 100;
      transition: background 0.15s, box-shadow 0.15s;
    }

    .draw-indicator.active {
      background: #7cff7c;
      box-shadow: 0 0 20px #7cff7c;
    }

    @media (max-width: 600px) {
      #status { font-size: 13px; padding: 10px 18px; max-width: 90vw; white-space: normal; }
      .controls button { padding: 10px 18px; font-size: 13px; }
    }
  </style>
</head>
<body>

<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>

  <div id="status">Запрос доступа к камере...</div>
  <div class="draw-indicator" id="drawIndicator"></div>

  <div class="controls">
    <button id="clearBtn" class="clear">🗑 Очистить</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

<script>
(function() {
  'use strict';

  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const drawIndicator = document.getElementById('drawIndicator');
  const clearBtn = document.getElementById('clearBtn');

  // === Состояние ===
  let isDrawing = false;
  let lastPoint = null;        // последняя реальная точка пальца
  let canvasWidth = 0;
  let canvasHeight = 0;
  let camera = null;

  // === Параметры рисования ===
  const LINE_WIDTH = 8;
  const LINE_COLOR = '#00e5ff';
  const GLOW_COLOR = 'rgba(0, 229, 255, 0.4)';

  // Насколько сильно "тянется" линия за пальцем.
  // 0 = линия строго под пальцем (без сглаживания)
  // Чем больше — тем плавнее, но с отставанием.
  const SMOOTHING = 0.35;      // легкое сглаживание для красоты, но почти без отставания

  // Порог распознавания выпрямленного указательного пальца
  const FINGER_EXTENDED_RATIO = 0.7;

  // === Инициализация canvas ===
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvasWidth = window.innerWidth;
    canvasHeight = window.innerHeight;

    canvas.width = canvasWidth * dpr;
    canvas.height = canvasHeight * dpr;
    canvas.style.width = canvasWidth + 'px';
    canvas.style.height = canvasHeight + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    setupDrawingStyle();
  }

  function setupDrawingStyle() {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = LINE_WIDTH;
    ctx.strokeStyle = LINE_COLOR;
    ctx.shadowColor = GLOW_COLOR;
    ctx.shadowBlur = 14;
  }

  window.addEventListener('resize', resizeCanvas);

  // === Очистка ===
  function clearCanvas() {
    ctx.clearRect(0, 0, canvasWidth, canvasHeight);
    lastPoint = null;
  }

  clearBtn.addEventListener('click', clearCanvas);

  // === Статус ===
  function setStatus(html, warn = false) {
    statusEl.innerHTML = html;
    statusEl.classList.remove('hidden');
    statusEl.classList.toggle('warn', warn);
  }
  function hideStatus() { statusEl.classList.add('hidden'); }

  function setDrawIndicator(active) {
    drawIndicator.classList.toggle('active', active);
  }

  // === Расстояние между точками ===
  function dist(a, b) {
    const dx = a.x - b.x;
    const dy = a.y - b.y;
    return Math.sqrt(dx * dx + dy * dy);
  }

  // === Проверка: поднят ли указательный палец ===
  function isIndexFingerExtended(lm) {
    const wrist = lm[0];
    const indexMcp = lm[5];
    const indexTip = lm[8];
    const dTip = dist(wrist, indexTip);
    const dMcp = dist(wrist, indexMcp);
    return dTip > dMcp * 1.15;
  }

  // === Рисование отрезка с интерполяцией ===
  // Если палец прыгнул далеко — рисуем несколько мелких отрезков, чтобы линия была сплошной
  function drawStroke(from, to) {
    const distance = dist(from, to);
    const maxStep = 6; // пикселей между промежуточными точками

    if (distance < maxStep) {
      // Маленькое движение — одна линия
      ctx.beginPath();
      ctx.moveTo(from.x, from.y);
      ctx.lineTo(to.x, to.y);
      ctx.stroke();
      return;
    }

    // Большое движение — интерполируем
    const steps = Math.ceil(distance / maxStep);
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const x = from.x + (to.x - from.x) * t;
      const y = from.y + (to.y - from.y) * t;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  // === Колбэк MediaPipe ===
  function onResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      const lm = results.multiHandLandmarks[0];
      const indexTip = lm[8];

      if (isIndexFingerExtended(lm)) {
        // Переводим нормализованные координаты (0..1) в пиксели canvas.
        // Из-за scaleX(-1) на видео и canvas — инвертируем X.
        const rawX = (1 - indexTip.x) * canvasWidth;
        const rawY = indexTip.y * canvasHeight;

        // Сглаживание (мягкое — чтобы убрать дрожание руки, но без сильного отставания)
        let x = rawX, y = rawY;
        if (lastPoint) {
          x = lastPoint.x * SMOOTHING + rawX * (1 - SMOOTHING);
          y = lastPoint.y * SMOOTHING + rawY * (1 - SMOOTHING);
        }
        const currentPoint = { x, y };

        if (!isDrawing) {
          // Начинаем новую линию — просто ставим точку
          isDrawing = true;
          lastPoint = currentPoint;
          setDrawIndicator(true);
          hideStatus();

          // Небольшая точка, чтобы было видно начало
          ctx.beginPath();
          ctx.arc(currentPoint.x, currentPoint.y, LINE_WIDTH / 2, 0, Math.PI * 2);
          ctx.fillStyle = LINE_COLOR;
          ctx.fill();
        } else {
          // Продолжаем рисовать — тянем линию от предыдущей точки к текущей
          if (lastPoint) {
            drawStroke(lastPoint, currentPoint);
          }
          lastPoint = currentPoint;
        }
      } else {
        // Палец не поднят — прекращаем
        if (isDrawing) {
          isDrawing = false;
          lastPoint = null;
          setDrawIndicator(false);
        }
      }
    } else {
      // Рука пропала из кадра
      if (isDrawing) {
        isDrawing = false;
        lastPoint = null;
        setDrawIndicator(false);
      }
    }
  }

  // === MediaPipe ===
  const hands = new Hands({
    locateFile: (file) =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
  });

  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,              // 1 — точнее отслеживание (важно для "прилипания" к пальцу)
    minDetectionConfidence: 0.7,
    minTrackingConfidence: 0.7,
    selfieMode: false,
  });

  hands.onResults(onResults);

  // === Запуск камеры ===
  async function startCamera() {
    try {
      setStatus('⏳ Запрос доступа к камере...');

      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error('Браузер не поддерживает доступ к камере');
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'user',
          width:  { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 60 }   // просим больше FPS — меньше задержка
        },
        audio: false
      });

      video.srcObject = stream;
      await new Promise(r => {
        video.onloadedmetadata = () => video.play().then(r).catch(r);
      });

      resizeCanvas();

      setStatus('✋ <span class="highlight">Поднимите указательный палец</span> и ведите им — линия пойдёт следом!');

      camera = new Camera(video, {
        onFrame: async () => { await hands.send({ image: video }); },
        width: 1280,
        height: 720,
      });
      await camera.start();

      setTimeout(hideStatus, 5000);

    } catch (err) {
      console.error(err);
      let msg = '❌ Не удалось получить доступ к камере.';
      if (err.name === 'NotAllowedError') msg = '🚫 Доступ запрещён. Разрешите камеру и обновите страницу.';
      else if (err.name === 'NotFoundError') msg = '📷 Камера не найдена.';
      else if (err.name === 'NotReadableError') msg = '⚠️ Камера занята другим приложением.';
      else if (err.message) msg = '❌ ' + err.message;
      setStatus(msg, true);
    }
  }

  window.addEventListener('load', () => {
    if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
      setStatus('❌ Ошибка загрузки MediaPipe. Проверьте интернет.', true);
      return;
    }
    resizeCanvas();
    setupDrawingStyle();
    startCamera();
  });
})();
</script>

</body>
</html>
