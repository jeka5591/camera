<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR / Камера</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        canvas { display: block; }

        #startBtn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 20px 50px; font-size: 20px; font-weight: bold;
            background: #4CAF50; color: white; border: none; border-radius: 50px;
            z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }
        #startBtn:active { background: #2E7D32; }

        #log {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.85);
            padding: 10px; font-size: 12px; font-family: monospace;
            max-height: 40vh; overflow-y: auto; z-index: 200;
            white-space: pre-wrap; word-break: break-word;
            line-height: 1.4;
        }
        #log .err { color: #ff6b6b; }
        #log .ok { color: #6bff8e; }
        #log .warn { color: #ffd93d; }

        #exitBtn {
            position: fixed; top: 10px; right: 10px;
            padding: 10px 16px; background: rgba(244,67,54,0.9);
            color: white; border: none; border-radius: 20px;
            font-size: 14px; z-index: 300; display: none;
        }

        /* Fallback video для не-AR режима */
        #fallbackVideo {
            position: fixed;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 1;
        }

        #modeIndicator {
            position: fixed;
            top: 10px; left: 10px;
            padding: 8px 14px;
            background: rgba(0,0,0,0.7);
            border-radius: 20px;
            font-size: 13px;
            z-index: 250;
            display: none;
        }
    </style>
</head>
<body>

    <video id="fallbackVideo" autoplay playsinline muted></video>
    <div id="modeIndicator"></div>
    <div id="log">Готов…</div>
    <button id="startBtn">🚀 Запустить</button>
    <button id="exitBtn">Выйти</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const logEl = document.getElementById('log');
        const startBtn = document.getElementById('startBtn');
        const exitBtn = document.getElementById('exitBtn');
        const fallbackVideo = document.getElementById('fallbackVideo');
        const modeIndicator = document.getElementById('modeIndicator');

        function log(msg, cls = '') {
            const line = document.createElement('div');
            if (cls) line.className = cls;
            line.textContent = new Date().toLocaleTimeString() + ' | ' + msg;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        function setMode(text) {
            modeIndicator.textContent = text;
            modeIndicator.style.display = 'block';
        }

        log('Загрузка…');
        log('Протокол: ' + location.protocol);
        log('navigator.xr: ' + (navigator.xr ? 'есть' : 'НЕТ'), navigator.xr ? 'ok' : 'err');

        // ==== THREE.JS ====
        let renderer, scene, camera, reticle;
        let arSession = null;
        let hitTestSource = null;
        let viewerSpace = null;
        let mode = null; // 'ar' | 'fallback'
        const cubes = [];

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.zIndex = '10';
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 100);

        scene.add(new THREE.AmbientLight(0xffffff, 2));
        const dir = new THREE.DirectionalLight(0xffffff, 1.5);
        dir.position.set(1, 2, 1);
        scene.add(dir);

        reticle = new THREE.Mesh(
            new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // ==== СТАРТ ====
        startBtn.addEventListener('click', start);

        async function start() {
            log('Проверка AR…');

            // Проверяем AR
            let arSupported = false;
            if (navigator.xr) {
                try {
                    arSupported = await navigator.xr.isSessionSupported('immersive-ar');
                } catch (e) {
                    log('Ошибка проверки AR: ' + e.message, 'err');
                }
            }
            log('immersive-ar: ' + (arSupported ? 'ДА' : 'НЕТ'), arSupported ? 'ok' : 'warn');

            if (arSupported) {
                await startAR();
            } else {
                log('Переключаюсь на обычную камеру…', 'warn');
                await startFallback();
            }
        }

        // ==== AR РЕЖИМ ====
        async function startAR() {
            try {
                log('Запрос AR-сессии (задняя камера — по умолчанию)…');

                // В immersive-ar браузер ВСЕГДА использует заднюю камеру.
                // Никаких настроек facingMode тут нет и не нужно.
                arSession = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test'],
                    optionalFeatures: ['local-floor']
                });

                log('AR сессия получена', 'ok');

                await renderer.xr.setSession(arSession);
                log('setSession — ок', 'ok');

                mode = 'ar';
                setMode('📷 AR (задняя камера)');
                startBtn.style.display = 'none';
                exitBtn.style.display = 'block';
                logEl.style.display = 'none';

                arSession.addEventListener('end', onAREnd);

                viewerSpace = await arSession.requestReferenceSpace('viewer');
                hitTestSource = await arSession.requestHitTestSource({ space: viewerSpace });
                log('hit-test source получен', 'ok');

                renderer.domElement.addEventListener('pointerdown', onTapAR);

                fallbackVideo.style.display = 'none';

            } catch (err) {
                log('ОШИБКА AR: ' + err.name + ' — ' + err.message, 'err');
                log('Пробую обычную камеру…', 'warn');
                await startFallback();
            }
        }

        function onTapAR(e) {
            if (mode !== 'ar') return;
            if (reticle.visible) {
                spawnCube(reticle.matrix);
                if (navigator.vibrate) navigator.vibrate(30);
            }
        }

        function onAREnd() {
            log('AR сессия завершена');
            arSession = null;
            hitTestSource = null;
            mode = null;
            cubes.forEach(c => scene.remove(c));
            cubes.length = 0;

            startBtn.style.display = 'block';
            exitBtn.style.display = 'none';
            logEl.style.display = 'block';
            modeIndicator.style.display = 'none';
        }

        // ==== FALLBACK: обычная камера (без AR) ====
        async function startFallback() {
            try {
                log('Запрос getUserMedia с задней камерой…');

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: 'environment' }, // ЗАДНЯЯ камера
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                log('Поток получен', 'ok');

                // Какая камера реально выбрана?
                const track = stream.getVideoTracks()[0];
                const settings = track.getSettings();
                log('Камера: ' + (settings.facingMode || 'неизвестно'), 'ok');
                log('Разрешение: ' + settings.width + 'x' + settings.height);

                // Показываем видео как фон
                fallbackVideo.srcObject = stream;
                fallbackVideo.style.display = 'block';
                await fallbackVideo.play();

                // Скрываем canvas (он всё равно прозрачный, но чтобы клики шли в video)
                renderer.domElement.style.display = 'none';

                mode = 'fallback';
                setMode('📷 Камера (без AR)');
                startBtn.style.display = 'none';
                exitBtn.style.display = 'block';
                logEl.style.display = 'none';

                // В fallback-режиме кубов нет — просто показываем камеру
                log('Fallback-режим активен');

            } catch (err) {
                log('ОШИБКА камеры: ' + err.name + ' — ' + err.message, 'err');
                if (err.name === 'NotAllowedError') {
                    log('Разреши доступ к камере в настройках браузера', 'warn');
                }
            }
        }

        // ==== ОБЩЕЕ ====
        function spawnCube(matrix) {
            const size = 0.15;
            const geo = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshStandardMaterial({ color: 0x4CAF50, roughness: 0.4 });
            const cube = new THREE.Mesh(geo, mat);

            const pos = new THREE.Vector3();
            const rot = new THREE.Quaternion();
            const scl = new THREE.Vector3();
            matrix.decompose(pos, rot, scl);
            pos.y += size / 2;
            cube.position.copy(pos);
            cube.scale.set(0.01, 0.01, 0.01);

            scene.add(cube);
            cubes.push(cube);
        }

        exitBtn.addEventListener('click', () => {
            if (arSession) {
                arSession.end();
            } else {
                // fallback — просто перезагружаем
                location.reload();
            }
        });

        // ==== RENDER LOOP ====
        renderer.setAnimationLoop((time, frame) => {
            if (mode === 'ar' && frame && arSession) {
                const refSpace = renderer.xr.getReferenceSpace();
                if (hitTestSource && refSpace) {
                    const results = frame.getHitTestResults(hitTestSource);
                    if (results.length > 0) {
                        const pose = results[0].getPose(refSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            cubes.forEach(c => {
                if (c.scale.x < 1) {
                    const ns = Math.min(1, c.scale.x + 0.1);
                    c.scale.set(ns, ns, ns);
                } else {
                    c.rotation.y += 0.005;
                }
            });

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
