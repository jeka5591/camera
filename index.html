<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Hand Hologram</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050505;
    font-family: Arial, sans-serif;
}

/* Камера */
#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    transform: scaleX(-1);

    background: black;
}

/* Canvas */
#canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

/* Панель */
#menu {
    position: fixed;

    top: 18px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 8px;

    z-index: 10;

    padding: 8px;

    background: rgba(0,0,0,.55);

    backdrop-filter: blur(10px);

    border-radius: 15px;
}

/* Кнопки */
button {
    border: 0;

    padding: 11px 18px;

    border-radius: 10px;

    background: rgba(255,255,255,.12);

    color: white;

    font-size: 15px;

    cursor: pointer;

    transition: .15s;
}

button:hover {
    background: rgba(255,255,255,.2);
}

button.active {
    background: #2196f3;
}

/* Статус */
#status {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    padding: 9px 16px;

    background: rgba(0,0,0,.65);

    color: white;

    border-radius: 10px;

    z-index: 10;

    font-size: 14px;
}

/* FPS */
#fps {
    position: fixed;

    right: 15px;
    top: 15px;

    color: #00ffcc;

    font-family: monospace;

    z-index: 10;

</style>
</head>

<body>

<video
    id="video"
    autoplay
    muted
    playsinline>
</video>

<canvas id="canvas"></canvas>

<div id="menu">

    <button id="drawButton" class="active">
        ✏️ Рисовать
    </button>

    <button id="squareButton">
        ⬛ Квадрат
    </button>

    <button id="clearButton">
        🗑 Очистить
    </button>

</div>

<div id="status">
    Режим: рисование
</div>

<div id="fps">
    FPS: --
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>


<script>

/* =====================================================
   ОСНОВНЫЕ ОБЪЕКТЫ
===================================================== */

const video =
    document.getElementById("video");

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: true
    });

const drawButton =
    document.getElementById("drawButton");

const squareButton =
    document.getElementById("squareButton");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");

const fpsText =
    document.getElementById("fps");


/* =====================================================
   РАЗМЕР ЭКРАНА
===================================================== */

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

resize();

window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   РЕЖИМ
===================================================== */

let mode = "draw";


function setMode(newMode) {

    mode = newMode;

    drawButton.classList.toggle(
        "active",
        mode === "draw"
    );

    squareButton.classList.toggle(
        "active",
        mode === "square"
    );

    if (mode === "draw") {

        status.textContent =
            "Режим: ✏️ рисование";

    } else {

        status.textContent =
            "Режим: ⬛ квадрат — две руки";

    }

    lastDrawPoint = null;
}


drawButton.onclick = () => {

    setMode("draw");

};

squareButton.onclick = () => {

    setMode("square");

};

clearButton.onclick = () => {

    drawingCanvas.clearRect(
        0,
        0,
        W,
        H
    );

};


/* =====================================================
   ОТДЕЛЬНЫЙ CANVAS ДЛЯ РИСОВАНИЯ
===================================================== */

const drawingCanvas =
    document.createElement("canvas");

drawingCanvas.width = W;
drawingCanvas.height = H;

const drawingCtx =
    drawingCanvas.getContext("2d");


window.addEventListener(
    "resize",
    () => {

        drawingCanvas.width = W;
        drawingCanvas.height = H;

    }
);


/* =====================================================
   ТОЧКА РИСОВАНИЯ
===================================================== */

let lastDrawPoint = null;


function drawLine(x, y) {

    if (!lastDrawPoint) {

        lastDrawPoint = {
            x,
            y
        };

        return;
    }


    drawingCtx.beginPath();

    drawingCtx.moveTo(
        lastDrawPoint.x,
        lastDrawPoint.y
    );

    drawingCtx.lineTo(
        x,
        y
    );

    drawingCtx.strokeStyle =
        "#00ffcc";

    drawingCtx.lineWidth = 6;

    drawingCtx.lineCap =
        "round";

    drawingCtx.lineJoin =
        "round";

    drawingCtx.stroke();


    lastDrawPoint = {
        x,
        y
    };
}


/* =====================================================
   КВАДРАТ
===================================================== */

let square = {

    x: W / 2 - 100,

    y: H / 2 - 100,

    size: 200
};


/* =====================================================
   СГЛАЖИВАНИЕ
===================================================== */

function smooth(oldValue, newValue, amount) {

    return oldValue +
        (newValue - oldValue) * amount;
}


let smoothHands = [];


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
    new Hands({

        locateFile: file => {

            return (
                "https://cdn.jsdelivr.net/npm/" +
                "@mediapipe/hands/" +
                file
            );

        }

    });


/*
   Здесь специально используем
   только одну руку одновременно,
   когда рисуем.

   Это сильно снижает нагрузку.
*/

hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 0,

    minDetectionConfidence: 0.55,

    minTrackingConfidence: 0.55

});


/* =====================================================
   ПОЛУЧЕНИЕ КООРДИНАТ
===================================================== */

function screenPoint(point) {

    return {

        x:
            (1 - point.x) * W,

        y:
            point.y * H

    };
}


/* =====================================================
   ОБРАБОТКА РУК
===================================================== */

let detectedHands = [];

let processing = false;

let lastResults = null;


hands.onResults(results => {

    processing = false;

    lastResults = results;

    detectedHands = [];


    if (!results.multiHandLandmarks) {

        return;
    }


    for (
        const hand
        of results.multiHandLandmarks
    ) {

        /*
         * Нужны только 4 точки:
         *
         * 4  = большой палец
         * 8  = указательный
         * 6  = сустав указательного
         * 12 = средний
         */

        const index =
            screenPoint(hand[8]);

        const indexJoint =
            screenPoint(hand[6]);

        const thumb =
            screenPoint(hand[4]);

        const middle =
            screenPoint(hand[12]);


        detectedHands.push({

            index,

            indexJoint,

            thumb,

            middle

        });

    }

});


/* =====================================================
   ЗАПУСК РАСПОЗНАВАНИЯ
===================================================== */

/*
 * Не отправляем кадр каждый миллисекунд.
 *
 * 30 FPS для распознавания
 * обычно намного легче для компьютера.
 */

let lastProcessTime = 0;

const PROCESS_INTERVAL = 33;


async function processCameraFrame(time) {

    requestAnimationFrame(
        processCameraFrame
    );


    if (
        video.readyState < 2
    ) {

        return;
    }


    if (
        processing
    ) {

        return;
    }


    if (
        time - lastProcessTime <
        PROCESS_INTERVAL
    ) {

        return;
    }


    lastProcessTime = time;

    processing = true;


    try {

        await hands.send({
            image: video
        });

    } catch (error) {

        processing = false;

        console.error(error);

    }

}


requestAnimationFrame(
    processCameraFrame
);


/* =====================================================
   FPS
===================================================== */

let frames = 0;

let fpsTime = performance.now();

function updateFPS(time) {

    frames++;

    if (
        time - fpsTime >= 1000
    ) {

        fpsText.textContent =
            "FPS: " + frames;

        frames = 0;

        fpsTime = time;
    }

    requestAnimationFrame(
        updateFPS
    );
}

requestAnimationFrame(
    updateFPS
);


/* =====================================================
   РИСОВАНИЕ ИНТЕРФЕЙСА
===================================================== */

function render() {

    requestAnimationFrame(
        render
    );


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
     * Сначала выводим рисунок.
     */

    ctx.drawImage(
        drawingCanvas,
        0,
        0
    );


    /*
     * Режим рисования.
     */

    if (
        mode === "draw"
    ) {

        renderDrawing();

    }


    /*
     * Режим квадрата.
     */

    if (
        mode === "square"
    ) {

        renderSquare();

    }

}


requestAnimationFrame(
    render
);


/* =====================================================
   РИСОВАНИЕ
===================================================== */

function renderDrawing() {

    if (
        detectedHands.length === 0
    ) {

        lastDrawPoint = null;

        return;
    }


    const hand =
        detectedHands[0];


    const index =
        hand.index;

    const joint =
        hand.indexJoint;


    /*
     * Проверяем, вытянут ли
     * указательный палец.
     */

    const extended =
        index.y < joint.y;


    if (!extended) {

        lastDrawPoint = null;

        return;
    }


    /*
     * Рисуем.
     */

    drawLine(
        index.x,
        index.y
    );


    /*
     * Маленький курсор.
     */

    ctx.beginPath();

    ctx.arc(
        index.x,
        index.y,
        7,
        0,
        Math.PI * 2
    );

    ctx.fillStyle =
        "#00ffcc";

    ctx.fill();

}


/* =====================================================
   КВАДРАТ
===================================================== */

function renderSquare() {

    if (
        detectedHands.length >= 2
    ) {

        const a =
            detectedHands[0].index;

        const b =
            detectedHands[1].index;


        const centerX =
            (a.x + b.x) / 2;

        const centerY =
            (a.y + b.y) / 2;


        const dx =
            b.x - a.x;

        const dy =
            b.y - a.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
         * Плавное изменение размера.
         */

        const targetSize =
            Math.max(
                60,
                distance
            );


        square.size =
            smooth(
                square.size,
                targetSize,
                0.25
            );


        square.x =
            smooth(
                square.x,
                centerX -
                square.size / 2,
                0.25
            );


        square.y =
            smooth(
                square.y,
                centerY -
                square.size / 2,
                0.25
            );

    }


    /*
     * Квадрат.
     */

    ctx.strokeStyle =
        "#00ffcc";

    ctx.lineWidth = 4;

    ctx.shadowColor =
        "#00ffcc";

    ctx.shadowBlur = 12;


    ctx.strokeRect(

        square.x,

        square.y,

        square.size,

        square.size

    );


    ctx.shadowBlur = 0;


    /*
     * Углы.
     */

    drawCorner(
        square.x,
        square.y
    );

    drawCorner(
        square.x + square.size,
        square.y + square.size
    );


    /*
     * Точки пальцев.
     */

    for (
        const hand
        of detectedHands
    ) {

        ctx.beginPath();

        ctx.arc(

            hand.index.x,

            hand.index.y,

            8,

            0,

            Math.PI * 2

        );

        ctx.fillStyle =
            "#00ffcc";

        ctx.fill();

    }

}


/* =====================================================
   УГОЛ
===================================================== */

function drawCorner(x, y) {

    ctx.beginPath();

    ctx.arc(

        x,
        y,

        12,

        0,
        Math.PI * 2

    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();

}


/* =====================================================
   КАМЕРА
===================================================== */

navigator.mediaDevices
.getUserMedia({

    video: {

        width: {
            ideal: 1280
        },

        height: {
            ideal: 720
        },

        frameRate: {
            ideal: 30,
            max: 30
        }

    },

    audio: false

})
.then(stream => {

    video.srcObject =
        stream;

})
.catch(error => {

    alert(
        "Не удалось получить доступ к камере."
    );

    console.error(error);

});

</script>

</body>
</html>
