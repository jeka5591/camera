```html
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Draw</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #app {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    video {
        position: absolute;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transform: scaleX(-1);
    }

    canvas {
        position: absolute;
        width: 100%;
        height: 100%;
    }

    #drawCanvas {
        pointer-events: none;
    }

    #info {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        background: rgba(0,0,0,.65);
        padding: 15px 20px;
        border-radius: 15px;
        font-size: 15px;
        line-height: 1.5;
    }

    button {
        position: absolute;
        right: 20px;
        top: 20px;
        z-index: 10;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        background: #2196f3;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }

    button:hover {
        background: #1976d2;
    }
</style>
</head>

<body>

<div id="app">

    <video id="video" autoplay playsinline></video>

    <canvas id="drawCanvas"></canvas>
    <canvas id="handCanvas"></canvas>

    <div id="info">
        🖐️ Покажи руку камере<br>
        ☝️ Указательный палец — рисовать<br>
        ✌️ Два пальца — управление квадратом<br>
        🤏 Потяни за угол квадрата
    </div>

    <button onclick="clearDrawing()">Очистить</button>

</div>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

<script>

const video = document.getElementById("video");
const drawCanvas = document.getElementById("drawCanvas");
const handCanvas = document.getElementById("handCanvas");

const drawCtx = drawCanvas.getContext("2d");
const handCtx = handCanvas.getContext("2d");

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;

    drawCanvas.width = W;
    drawCanvas.height = H;

    handCanvas.width = W;
    handCanvas.height = H;
}

window.addEventListener("resize", resize);
resize();


// -----------------------------
// КВАДРАТ
// -----------------------------

let square = {
    x: W / 2 - 100,
    y: H / 2 - 100,
    size: 200
};

let draggingCorner = false;


// Проверяем расстояние между точками
function distance(a, b) {
    return Math.sqrt(
        Math.pow(a.x - b.x, 2) +
        Math.pow(a.y - b.y, 2)
    );
}


// -----------------------------
// РИСОВАНИЕ
// -----------------------------

let drawing = false;
let lastPoint = null;

function draw(x, y) {

    if (!lastPoint) {
        lastPoint = {x, y};
        return;
    }

    drawCtx.beginPath();

    drawCtx.moveTo(lastPoint.x, lastPoint.y);
    drawCtx.lineTo(x, y);

    drawCtx.strokeStyle = "#00ffcc";
    drawCtx.lineWidth = 6;
    drawCtx.lineCap = "round";

    drawCtx.stroke();

    lastPoint = {x, y};
}


function clearDrawing() {
    drawCtx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );
}


// -----------------------------
// MEDIAPIPE
// -----------------------------

const hands = new Hands({
    locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }
});

hands.setOptions({
    maxNumHands: 2,
    modelComplexity: 1,
    minDetectionConfidence: 0.6,
    minTrackingConfidence: 0.6
});


hands.onResults(results => {

    handCtx.clearRect(
        0,
        0,
        handCanvas.width,
        handCanvas.height
    );

    // Рисуем квадрат
    handCtx.strokeStyle = "#ffffff";
    handCtx.lineWidth = 4;

    handCtx.strokeRect(
        square.x,
        square.y,
        square.size,
        square.size
    );

    // Угол квадрата
    handCtx.fillStyle = "#ff4444";

    handCtx.beginPath();
    handCtx.arc(
        square.x + square.size,
        square.y + square.size,
        12,
        0,
        Math.PI * 2
    );
    handCtx.fill();


    if (!results.multiHandLandmarks) {
        lastPoint = null;
        return;
    }


    // -----------------------------
    // ОБРАБОТКА РУК
    // -----------------------------

    for (const landmarks of results.multiHandLandmarks) {

        drawConnectors(
            handCtx,
            landmarks,
            HAND_CONNECTIONS,
            {
                color: "#00ff88",
                lineWidth: 2
            }
        );

        drawLandmarks(
            handCtx,
            landmarks,
            {
                color: "#ffffff",
                lineWidth: 1,
                radius: 4
            }
        );


        // Указательный палец
        const index = landmarks[8];

        // Средний палец
        const middle = landmarks[12];


        const ix = (1 - index.x) * W;
        const iy = index.y * H;

        const mx = (1 - middle.x) * W;
        const my = middle.y * H;


        // -----------------------------
        // РАСТЯГИВАНИЕ КВАДРАТА
        // -----------------------------

        const corner = {
            x: square.x + square.size,
            y: square.y + square.size
        };

        const d = distance(
            {x: ix, y: iy},
            corner
        );


        // Если указательный палец около угла
        if (d < 50) {
            draggingCorner = true;
        }


        if (draggingCorner) {

            let newSize = Math.max(
                50,
                ix - square.x
            );

            square.size = newSize;


            // Если палец ушёл далеко
            if (d > 150) {
                draggingCorner = false;
            }

        }


        // -----------------------------
        // РИСОВАНИЕ
        // -----------------------------

        // Расстояние между указательным
        // и средним пальцем

        const fingersDistance = distance(
            {x: ix, y: iy},
            {x: mx, y: my}
        );


        // Если указательный палец вытянут,
        // а средний согнут — рисуем

        const indexTip = landmarks[8];
        const indexPip = landmarks[6];

        const indexExtended =
            indexTip.y < indexPip.y;


        if (
            indexExtended &&
            fingersDistance > 45 &&
            !draggingCorner
        ) {

            drawing = true;

            draw(ix, iy);

        } else {

            drawing = false;
            lastPoint = null;

        }

    }


    // -----------------------------
    // ДВЕ РУКИ
    // -----------------------------

    if (results.multiHandLandmarks.length >= 2) {

        const hand1 = results.multiHandLandmarks[0];
        const hand2 = results.multiHandLandmarks[1];

        const p1 = {
            x: (1 - hand1[8].x) * W,
            y: hand1[8].y * H
        };

        const p2 = {
            x: (1 - hand2[8].x) * W,
            y: hand2[8].y * H
        };


        const d = distance(p1, p2);

        // Если два указательных пальца
        // находятся около разных областей,
        // можно изменять размер квадрата

        if (d > 80 && d < 800) {

            const centerX = (p1.x + p2.x) / 2;
            const centerY = (p1.y + p2.y) / 2;

            const newSize = Math.max(
                50,
                d
            );

            square.size = newSize;

            square.x =
                centerX - newSize / 2;

            square.y =
                centerY - newSize / 2;
        }
    }

});


// -----------------------------
// ЗАПУСК КАМЕРЫ
// -----------------------------

const camera = new Camera(video, {

    onFrame: async () => {
        await hands.send({
            image: video
        });
    },

    width: 1280,
    height: 720

});

camera.start();

</script>

</body>
</html>
