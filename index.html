<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Комната — 3D кубы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: white;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
        }

        canvas { display: block; }

        #ar-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(76, 175, 80, 0.5);
            z-index: 9999;
            transition: transform 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }
        #ar-button:active { transform: translateX(-50%) scale(0.95); }

        #info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 20px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 9999;
            text-align: center;
            max-width: 92%;
            line-height: 1.4;
        }

        #controls {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            display: none;
            gap: 8px;
            z-index: 9999;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 10px;
        }
        #controls button {
            padding: 10px 14px;
            font-size: 13px;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        #controls button.active {
            background: rgba(76, 175, 80, 0.9);
            border-color: #4CAF50;
        }

        .color-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        #not-supported {
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 25px;
            text-align: center;
            z-index: 10000;
            overflow-y: auto;
        }
        #not-supported h2 { margin-bottom: 16px; color: #ff6b6b; font-size: 22px; }
        #not-supported p { margin-bottom: 10px; line-height: 1.5; max-width: 480px; font-size: 15px; }
        #not-supported code {
            background: #333;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        #reticle {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 44px;
            height: 44px;
            margin: -22px 0 0 -22px;
            border: 3px solid white;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            z-index: 9998;
            opacity: 0.8;
            box-shadow: 0 0 12px rgba(255,255,255,0.5);
        }
        #reticle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            background: white;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <div id="info">Нажмите кнопку ниже 👇</div>
    <div id="reticle"></div>

    <div id="controls">
        <button data-color="0x4CAF50" class="active"><span class="color-dot" style="background:#4CAF50"></span>Зел</button>
        <button data-color="0x2196F3"><span class="color-dot" style="background:#2196F3"></span>Син</button>
        <button data-color="0xFF5722"><span class="color-dot" style="background:#FF5722"></span>Оранж</button>
        <button data-color="0xE91E63"><span class="color-dot" style="background:#E91E63"></span>Роз</button>
        <button id="clear-btn">🗑️</button>
    </div>

    <button id="ar-button" type="button">🚀 Начать AR</button>

    <div id="not-supported">
        <h2>😕 AR не запускается</h2>
        <div id="not-supported-msg"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        // ============ ЭЛЕМЕНТЫ ============
        const infoEl = document.getElementById('info');
        const arButtonEl = document.getElementById('ar-button');
        const controlsEl = document.getElementById('controls');
        const reticleEl = document.getElementById('reticle');
        const notSupported = document.getElementById('not-supported');
        const notSupportedMsg = document.getElementById('not-supported-msg');

        // ============ ПРОВЕРКА УСЛОВИЙ ============
        function showError(html) {
            notSupportedMsg.innerHTML = html;
            notSupported.style.display = 'flex';
            arButtonEl.style.display = 'none';
        }

        // 1. HTTPS?
        const isSecure = location.protocol === 'https:' ||
                         location.hostname === 'localhost' ||
                         location.hostname === '127.0.0.1';

        if (!isSecure) {
            showError(`
                <p>❌ Сайт открыт <b>без HTTPS</b>.</p>
                <p>AR и камера работают только по защищённому соединению.</p>
                <p>Загрузите этот файл на хостинг с HTTPS<br>(например, <code>GitHub Pages</code>, <code>Netlify</code>, <code>Vercel</code>).</p>
                <p>Или откройте через <code>localhost</code>.</p>
            `);
        }

        // 2. WebXR есть?
        if (isSecure && !navigator.xr) {
            showError(`
                <p>❌ Браузер не поддерживает <b>WebXR</b>.</p>
                <p>На Android используйте <b>Chrome</b> (последняя версия) или <b>Edge</b>.</p>
                <p>На iPhone — <b>WebXR пока не работает</b> в Safari, даже в iOS 17. Можно попробовать приложение <b>WebXR Viewer</b> от Mozilla.</p>
            `);
        }

        // 3. immersive-ar поддерживается?
        if (isSecure && navigator.xr) {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if (!supported) {
                    showError(`
                        <p>❌ Устройство не поддерживает <b>immersive-ar</b>.</p>
                        <p>Нужен <b>Android 8+</b> с <b>ARCore</b> (Google Play Services for AR).</p>
                        <p>Установите <b>"Google Play Services for AR"</b> из Play Store и попробуйте снова.</p>
                    `);
                }
            }).catch(err => {
                console.error(err);
            });
        }

        // ============ ИНИЦИАЛИЗАЦИЯ THREE.JS ============
        let renderer, scene, camera;
        let reticle, hitTestSource = null, hitTestSourceRequested = false;
        let currentColor = 0x4CAF50;
        const cubes = [];

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(1, 2, 1);
        scene.add(dirLight);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        // Прицел
        reticle = new THREE.Mesh(
            new THREE.RingGeometry(0.08, 0.10, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // ============ AR КНОПКА ЧЕРЕЗ ARBUTTON ============
        // Three.js создаст свою кнопку — мы её кликнем программно
        const threeArButton = ARButton.createButton(renderer, {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['dom-overlay'],
            domOverlay: { root: document.body }
        });

        // Стилизуем и прячем кнопку Three.js (но она в DOM!)
        threeArButton.style.position = 'fixed';
        threeArButton.style.bottom = '30px';
        threeArButton.style.left = '50%';
        threeArButton.style.transform = 'translateX(-50%)';
        threeArButton.style.zIndex = '9999';
        threeArButton.style.padding = '18px 40px';
        threeArButton.style.fontSize = '20px';
        threeArButton.style.fontWeight = 'bold';
        threeArButton.style.background = 'linear-gradient(135deg, #4CAF50, #2E7D32)';
        threeArButton.style.color = 'white';
        threeArButton.style.border = 'none';
        threeArButton.style.borderRadius = '50px';
        threeArButton.style.cursor = 'pointer';
        threeArButton.style.display = 'none'; // прячем, у нас своя

        // Показываем нашу кнопку, но кликаем по кнопке Three.js
        // ВАЖНО: используем pointerdown — работает и на мобилках
        const startHandler = (e) => {
            e.preventDefault();
            e.stopPropagation();
            console.log('Клик по AR кнопке');
            // Программный клик по нативной кнопке Three.js
            threeArButton.click();
        };

        arButtonEl.addEventListener('pointerdown', startHandler);
        arButtonEl.addEventListener('click', (e) => {
            // Резервный обработчик
            if (e.pointerType !== 'mouse') return; // на мобилке pointerdown уже сработал
        });

        // ============ СОБЫТИЯ СЕССИИ ============
        renderer.xr.addEventListener('sessionstart', () => {
            console.log('AR started');
            infoEl.textContent = 'Наведите на поверхность и тапните';
            infoEl.style.display = 'block';
            arButtonEl.style.display = 'none';
            threeArButton.style.display = 'none';
            controlsEl.style.display = 'flex';
            reticleEl.style.display = 'block';
        });

        renderer.xr.addEventListener('sessionend', () => {
            console.log('AR ended');
            infoEl.textContent = 'Нажмите кнопку ниже 👇';
            arButtonEl.style.display = 'block';
            threeArButton.style.display = 'none';
            controlsEl.style.display = 'none';
            reticleEl.style.display = 'none';
            reticle.visible = false;

            cubes.forEach(c => scene.remove(c));
            cubes.length = 0;
            hitTestSource = null;
            hitTestSourceRequested = false;
        });

        // ============ КЛИК ПО ЭКРАНУ → СПАВН ============
        const spawnHandler = (e) => {
            e.preventDefault();
            if (!renderer.xr.isPresenting) return;
            if (reticle.visible) {
                spawnCube(reticle.matrix);
                if (navigator.vibrate) navigator.vibrate(30);
            }
        };

        renderer.domElement.addEventListener('pointerdown', spawnHandler);

        // ============ СПАВН КУБА ============
        function spawnCube(matrix) {
            const size = 0.1 + Math.random() * 0.1;
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshStandardMaterial({
                color: currentColor,
                roughness: 0.4,
                metalness: 0.1
            });
            const cube = new THREE.Mesh(geometry, material);

            const position = new THREE.Vector3();
            const rotation = new THREE.Quaternion();
            const scale = new THREE.Vector3();
            matrix.decompose(position, rotation, scale);

            position.y += size / 2;
            cube.position.copy(position);
            cube.rotation.y = Math.random() * Math.PI * 2;

            cube.scale.set(0.01, 0.01, 0.01);
            scene.add(cube);
            cubes.push(cube);
        }

        function animateCubes() {
            cubes.forEach(cube => {
                const s = cube.scale.x;
                if (s < 1) {
                    const ns = Math.min(1, s + 0.1);
                    cube.scale.set(ns, ns, ns);
                } else {
                    cube.rotation.y += 0.003;
                }
            });
        }

        // ============ HIT-TEST ============
        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (!hitTestSourceRequested) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const results = frame.getHitTestResults(hitTestSource);
                    if (results.length) {
                        const pose = results[0].getPose(referenceSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            animateCubes();
            renderer.render(scene, camera);
        }

        renderer.setAnimationLoop(render);

        // ============ UI — ЦВЕТА ============
        document.querySelectorAll('#controls button[data-color]').forEach(btn => {
            btn.addEventListener('pointerdown', (e) => {
                e.preventDefault();
                e.stopPropagation();
                document.querySelectorAll('#controls button[data-color]')
                    .forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = parseInt(btn.dataset.color);
            });
        });

        document.getElementById('clear-btn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            cubes.forEach(c => scene.remove(c));
            cubes.length = 0;
        });

        // ============ RESIZE ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
