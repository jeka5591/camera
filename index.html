<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR тест</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; font-family: sans-serif; }
        canvas { display: block; }

        #startBtn {
            position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%);
            padding: 20px 50px; font-size: 22px; font-weight: bold;
            background: #4CAF50; color: white; border: none; border-radius: 50px;
            z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        #startBtn:active { background: #2E7D32; }

        #log {
            position: fixed; top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.85);
            padding: 10px; font-size: 12px; font-family: monospace;
            max-height: 35vh; overflow-y: auto; z-index: 200;
            white-space: pre-wrap; word-break: break-word;
            line-height: 1.4;
        }
        #log .err { color: #ff6b6b; }
        #log .ok { color: #6bff8e; }
        #log .warn { color: #ffd93d; }

        #exitBtn {
            position: fixed; top: 10px; right: 10px;
            padding: 10px 16px; background: rgba(244,67,54,0.9);
            color: white; border: none; border-radius: 20px;
            font-size: 14px; z-index: 300; display: none;
        }
    </style>
</head>
<body>

    <div id="log">Готов к запуску…</div>
    <button id="startBtn">🚀 Запустить AR</button>
    <button id="exitBtn">Выйти</button>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const logEl = document.getElementById('log');
        const startBtn = document.getElementById('startBtn');
        const exitBtn = document.getElementById('exitBtn');

        function log(msg, cls = '') {
            const line = document.createElement('div');
            if (cls) line.className = cls;
            line.textContent = new Date().toLocaleTimeString() + ' | ' + msg;
            logEl.appendChild(line);
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        log('Страница загружена');
        log('Протокол: ' + location.protocol);
        log('navigator.xr: ' + (navigator.xr ? 'есть' : 'НЕТ'), navigator.xr ? 'ok' : 'err');

        if (!navigator.xr) {
            log('WebXR не поддерживается', 'err');
        } else {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                log('immersive-ar: ' + (supported ? 'ДА' : 'НЕТ'), supported ? 'ok' : 'err');
            }).catch(e => {
                log('Ошибка проверки: ' + e.message, 'err');
            });
        }

        // ==== THREE.JS ====
        let renderer, scene, camera, reticle;
        let session = null;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        let viewerSpace = null;
        const cubes = [];
        let currentColor = 0x4CAF50;

        // Создаём renderer заранее, но НЕ запускаем AR
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.domElement.style.position = 'fixed';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        document.body.appendChild(renderer.domElement);

        log('Three.js renderer создан');

        // Сцена
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        const ambient = new THREE.AmbientLight(0xffffff, 2);
        scene.add(ambient);
        const dir = new THREE.DirectionalLight(0xffffff, 1.5);
        dir.position.set(1, 2, 1);
        scene.add(dir);

        // Прицел
        reticle = new THREE.Mesh(
            new THREE.RingGeometry(0.08, 0.1, 32).rotateX(-Math.PI / 2),
            new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        // Лёгкая подсветка — куб прямо перед камерой, чтобы видеть, что рендер идёт
        // (убирается при старте сессии)
        const testCube = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.5, 0.5),
            new THREE.MeshStandardMaterial({ color: 0x4CAF50 })
        );
        testCube.position.set(0, 0, -1);
        scene.add(testCube);

        log('Сцена настроена');

        // ==== ЗАПУСК AR ====
        startBtn.addEventListener('click', startAR);

        async function startAR() {
            log('Запрос AR сессии…');

            try {
                if (!navigator.xr) {
                    log('WebXR недоступен', 'err');
                    return;
                }

                // ВАЖНО: БЕЗ dom-overlay — это частая причина чёрного экрана
                session = await navigator.xr.requestSession('immersive-ar', {
                    requiredFeatures: ['hit-test'],
                    optionalFeatures: ['local-floor']
                });

                log('Сессия получена!', 'ok');

                await renderer.xr.setSession(session);
                log('renderer.xr.setSession — ок', 'ok');

                // Убираем тестовый куб
                scene.remove(testCube);

                startBtn.style.display = 'none';
                exitBtn.style.display = 'block';
                logEl.style.display = 'none'; // скрываем лог, чтобы не мешал

                // Обработка завершения сессии
                session.addEventListener('end', onSessionEnd);

                // Hit-test
                viewerSpace = await session.requestReferenceSpace('viewer');
                hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
                log('hit-test source получен', 'ok');

                // Клик по экрану — спавн куба
                renderer.domElement.addEventListener('pointerdown', onTap);

            } catch (err) {
                log('ОШИБКА: ' + err.name + ' — ' + err.message, 'err');
                console.error(err);
            }
        }

        function onTap(e) {
            if (!session) return;
            if (reticle.visible) {
                spawnCube(reticle.matrix);
                if (navigator.vibrate) navigator.vibrate(30);
            } else {
                log('Прицел не найден — наведи на поверхность');
            }
        }

        function spawnCube(matrix) {
            const size = 0.15;
            const geo = new THREE.BoxGeometry(size, size, size);
            const mat = new THREE.MeshStandardMaterial({ color: currentColor, roughness: 0.4 });
            const cube = new THREE.Mesh(geo, mat);

            const pos = new THREE.Vector3();
            const rot = new THREE.Quaternion();
            const scl = new THREE.Vector3();
            matrix.decompose(pos, rot, scl);

            pos.y += size / 2;
            cube.position.copy(pos);
            cube.scale.set(0.01, 0.01, 0.01);

            scene.add(cube);
            cubes.push(cube);
            log('Куб заспавнен на y=' + pos.y.toFixed(2));
        }

        function onSessionEnd() {
            log('Сессия завершена');
            session = null;
            hitTestSource = null;
            hitTestSourceRequested = false;
            cubes.forEach(c => scene.remove(c));
            cubes.length = 0;

            scene.add(testCube);

            startBtn.style.display = 'block';
            exitBtn.style.display = 'none';
            logEl.style.display = 'block';
        }

        exitBtn.addEventListener('click', () => {
            if (session) session.end();
        });

        // ==== RENDER LOOP ====
        renderer.setAnimationLoop((time, frame) => {
            if (frame && session) {
                const refSpace = renderer.xr.getReferenceSpace();
                if (hitTestSource && refSpace) {
                    const results = frame.getHitTestResults(hitTestSource);
                    if (results.length > 0) {
                        const pose = results[0].getPose(refSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            // Анимация появления кубов
            cubes.forEach(c => {
                if (c.scale.x < 1) {
                    const ns = Math.min(1, c.scale.x + 0.1);
                    c.scale.set(ns, ns, ns);
                } else {
                    c.rotation.y += 0.005;
                }
            });

            renderer.render(scene, camera);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
