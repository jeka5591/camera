<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Управление руками</title>

<style>

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
}

#video {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: cover;

    /* Зеркальное изображение камеры */
    transform: scaleX(-1);
}

canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    pointer-events: none;
}

#ui {
    position: fixed;
    top: 20px;
    left: 50%;

    transform: translateX(-50%);

    display: flex;
    gap: 10px;

    z-index: 20;
}

button {
    border: 0;

    padding: 13px 22px;

    border-radius: 12px;

    background: rgba(30,30,30,.9);

    color: white;

    font-size: 16px;

    cursor: pointer;
}

button.active {
    background: #2196f3;
}

#clear {
    background: #e53935;
}

#status {
    position: fixed;

    bottom: 20px;
    left: 50%;

    transform: translateX(-50%);

    z-index: 20;

    padding: 10px 18px;

    border-radius: 12px;

    background: rgba(0,0,0,.7);

    color: white;
}

</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<canvas id="drawCanvas"></canvas>
<canvas id="handCanvas"></canvas>

<div id="ui">

    <button id="drawMode" class="active">
        ✏️ Рисование
    </button>

    <button id="squareMode">
        ⬛ Квадрат
    </button>

    <button id="clear">
        🗑 Очистить
    </button>

</div>

<div id="status">
    Режим: Рисование
</div>


<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>


<script>

const video = document.getElementById("video");

const drawCanvas =
    document.getElementById("drawCanvas");

const handCanvas =
    document.getElementById("handCanvas");

const drawCtx =
    drawCanvas.getContext("2d");

const handCtx =
    handCanvas.getContext("2d");

const drawButton =
    document.getElementById("drawMode");

const squareButton =
    document.getElementById("squareMode");

const clearButton =
    document.getElementById("clear");

const status =
    document.getElementById("status");


// ==================================================
// РАЗМЕР
// ==================================================

function resize() {

    drawCanvas.width = window.innerWidth;
    drawCanvas.height = window.innerHeight;

    handCanvas.width = window.innerWidth;
    handCanvas.height = window.innerHeight;
}

resize();

window.addEventListener("resize", resize);


// ==================================================
// РЕЖИМ
// ==================================================

let mode = "draw";


function setMode(newMode) {

    mode = newMode;

    drawButton.classList.remove("active");
    squareButton.classList.remove("active");

    if (mode === "draw") {

        drawButton.classList.add("active");

        status.textContent =
            "Режим: Рисование";

    }

    if (mode === "square") {

        squareButton.classList.add("active");

        status.textContent =
            "Режим: Квадрат — растягивай двумя руками";

        lastPoint = null;
    }
}


drawButton.onclick = () => {
    setMode("draw");
};

squareButton.onclick = () => {
    setMode("square");
};

clearButton.onclick = () => {

    drawCtx.clearRect(
        0,
        0,
        drawCanvas.width,
        drawCanvas.height
    );
};


// ==================================================
// РИСОВАНИЕ
// ==================================================

let lastPoint = null;


function draw(x, y) {

    if (!lastPoint) {

        lastPoint = {
            x: x,
            y: y
        };

        return;
    }

    drawCtx.beginPath();

    drawCtx.moveTo(
        lastPoint.x,
        lastPoint.y
    );

    drawCtx.lineTo(
        x,
        y
    );

    drawCtx.strokeStyle = "#00ffcc";

    drawCtx.lineWidth = 7;

    drawCtx.lineCap = "round";

    drawCtx.lineJoin = "round";

    drawCtx.stroke();

    lastPoint = {
        x: x,
        y: y
    };
}


// ==================================================
// КВАДРАТ
// ==================================================

let square = {

    x: window.innerWidth / 2 - 100,

    y: window.innerHeight / 2 - 100,

    width: 200,

    height: 200

};


// ==================================================
// ТОЧКА ИЗ MEDIAPIPE В ЭКРАН
// ==================================================

function pointToScreen(point) {

    return {

        /*
         * ВАЖНО:
         *
         * Видео зеркальное.
         * Поэтому X тоже зеркалим.
         */

        x: (1 - point.x) *
           window.innerWidth,

        y: point.y *
           window.innerHeight
    };
}


// ==================================================
// РАССТОЯНИЕ
// ==================================================

function distance(a, b) {

    return Math.sqrt(

        Math.pow(a.x - b.x, 2) +

        Math.pow(a.y - b.y, 2)
    );
}


// ==================================================
// MEDIAPIPE
// ==================================================

const hands = new Hands({

    locateFile: file => {

        return (
            "https://cdn.jsdelivr.net/npm/" +
            "@mediapipe/hands/" +
            file
        );
    }

});


hands.setOptions({

    maxNumHands: 2,

    modelComplexity: 1,

    minDetectionConfidence: 0.65,

    minTrackingConfidence: 0.65

});


// ==================================================
// РЕЗУЛЬТАТ
// ==================================================

hands.onResults(results => {

    handCtx.clearRect(

        0,
        0,

        handCanvas.width,
        handCanvas.height
    );


    // ==============================================
    // РИСУЕМ РУКИ
    // ==============================================

    if (results.multiHandLandmarks) {

        for (
            const landmarks
            of results.multiHandLandmarks
        ) {

            /*
             * Раньше модель была смещена,
             * потому что координаты руки
             * и видео зеркалились по-разному.
             *
             * Теперь используем те же
             * зеркальные координаты.
             */

            const mirrored =
                landmarks.map(point => {

                    return {

                        x: 1 - point.x,

                        y: point.y,

                        z: point.z

                    };

                });


            drawConnectors(

                handCtx,

                mirrored,

                HAND_CONNECTIONS,

                {

                    color: "#00ff88",

                    lineWidth: 3

                }

            );


            drawLandmarks(

                handCtx,

                mirrored,

                {

                    color: "#ffffff",

                    lineWidth: 1,

                    radius: 5

                }

            );

        }

    }


    // ==============================================
    // КВАДРАТ
    // ==============================================

    if (mode === "square") {

        drawSquare();
    }


    // ==============================================
    // НЕТ РУК
    // ==============================================

    if (
        !results.multiHandLandmarks ||
        results.multiHandLandmarks.length === 0
    ) {

        lastPoint = null;

        return;
    }


    // ==============================================
    // РЕЖИМ РИСОВАНИЯ
    // ==============================================

    if (mode === "draw") {

        const hand =
            results.multiHandLandmarks[0];


        const index =
            pointToScreen(hand[8]);

        const pip =
            pointToScreen(hand[6]);


        /*
         * Проверяем, вытянут ли
         * указательный палец.
         */

        const indexExtended =
            index.y < pip.y;


        /*
         * Большой палец и указательный
         * должны быть достаточно далеко.
         */

        const thumb =
            pointToScreen(hand[4]);


        const fingerDistance =
            distance(index, thumb);


        if (
            indexExtended &&
            fingerDistance > 35
        ) {

            draw(
                index.x,
                index.y
            );

        } else {

            lastPoint = null;
        }

        return;
    }


    // ==============================================
    // РЕЖИМ КВАДРАТА
    // ==============================================

    if (mode === "square") {

        handleSquare(results);
    }

});


// ==================================================
// КВАДРАТ НА ЭКРАНЕ
// ==================================================

function drawSquare() {

    handCtx.save();

    handCtx.strokeStyle = "#ffffff";

    handCtx.lineWidth = 5;

    handCtx.strokeRect(

        square.x,

        square.y,

        square.width,

        square.height
    );


    /*
     * Показываем точки,
     * за которые нужно брать квадрат.
     */

    handCtx.fillStyle = "#ff3b30";


    // левый верхний

    drawHandle(
        square.x,
        square.y
    );


    // правый нижний

    drawHandle(

        square.x + square.width,

        square.y + square.height
    );


    handCtx.restore();
}


function drawHandle(x, y) {

    handCtx.beginPath();

    handCtx.arc(

        x,
        y,

        14,

        0,

        Math.PI * 2
    );

    handCtx.fill();
}


// ==================================================
// УПРАВЛЕНИЕ КВАДРАТОМ
// ==================================================

let grabbing = false;


function handleSquare(results) {

    if (
        results.multiHandLandmarks.length < 2
    ) {

        grabbing = false;

        return;
    }


    const hand1 =
        results.multiHandLandmarks[0];

    const hand2 =
        results.multiHandLandmarks[1];


    /*
     * Берём указательные пальцы
     * двух рук.
     */

    const p1 =
        pointToScreen(hand1[8]);

    const p2 =
        pointToScreen(hand2[8]);


    // ==============================================
    // ДВЕ ТОЧКИ
    // ==============================================

    /*
     * Получаем прямоугольник
     * между пальцами.
     */

    const left =
        Math.min(p1.x, p2.x);

    const right =
        Math.max(p1.x, p2.x);

    const top =
        Math.min(p1.y, p2.y);

    const bottom =
        Math.max(p1.y, p2.y);


    const width =
        right - left;

    const height =
        bottom - top;


    /*
     * Делаем именно квадрат.
     */

    const size =
        Math.max(
            60,
            Math.max(width, height)
        );


    /*
     * Центр между двумя руками.
     */

    const centerX =
        (p1.x + p2.x) / 2;

    const centerY =
        (p1.y + p2.y) / 2;


    square.width = size;

    square.height = size;

    square.x =
        centerX - size / 2;

    square.y =
        centerY - size / 2;


    grabbing = true;
}


// ==================================================
// КАМЕРА
// ==================================================

const camera =
    new Camera(

        video,

        {

            onFrame: async () => {

                await hands.send({

                    image: video

                });

            },

            width: 1280,

            height: 720

        }

    );


camera.start();

</script>

</body>
</html>
