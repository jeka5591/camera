<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Камера + 3D кубик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Видео с камеры — на весь экран */
        #video {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 1;
            background: #000;
        }

        /* Canvas с 3D — поверх видео */
        #scene {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none; /* клики проходят сквозь */
        }

        /* Кнопка запуска */
        #startBtn {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 22px 55px;
            font-size: 22px;
            font-weight: bold;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            border-radius: 60px;
            z-index: 100;
            box-shadow: 0 10px 40px rgba(76, 175, 80, 0.6);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.05); }
        }
        #startBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
            animation: none;
        }

        /* Лог ошибок */
        #log {
            position: fixed;
            top: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.85);
            padding: 10px;
            font-size: 12px;
            font-family: monospace;
            max-height: 40vh;
            overflow-y: auto;
            z-index: 200;
            display: none;
            white-space: pre-wrap;
            line-height: 1.4;
        }
        #log.visible { display: block; }
        #log .err { color: #ff6b6b; }
        #log .ok { color: #6bff8e; }

        /* Панель управления */
        #toolbar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 10px;
            z-index: 100;
            padding: 10px 14px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.15);
        }
        #toolbar.visible { display: flex; }

        #toolbar button {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            background: transparent;
            cursor: pointer;
            position: relative;
            padding: 0;
            transition: transform 0.15s, border-color 0.2s;
        }
        #toolbar button:active { transform: scale(0.9); }
        #toolbar button.active {
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255,255,255,0.6);
            transform: scale(1.15);
        }

        #toolbar .color-btn {
            background: var(--c);
        }

        #toolbar .action-btn {
            background: rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
        }

        /* Подсказка */
        #hint {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 25px;
            font-size: 13px;
            z-index: 99;
            display: none;
            text-align: center;
            max-width: 90%;
            line-height: 1.4;
            animation: fadeOut 5s forwards;
        }
        #hint.visible { display: block; }
        @keyframes fadeOut {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Кнопка закрытия / смены камеры */
        #topBar {
            position: fixed;
            top: 12px;
            right: 12px;
            display: none;
            gap: 8px;
            z-index: 100;
        }
        #topBar.visible { display: flex; }
        #topBar button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        #topBar button:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="scene"></canvas>

    <div id="hint"></div>

    <div id="topBar">
        <button id="switchCamBtn" title="Сменить камеру">🔄</button>
        <button id="stopBtn" title="Стоп">✕</button>
    </div>

    <div id="toolbar">
        <button class="color-btn active" data-color="#4CAF50" style="--c:#4CAF50"></button>
        <button class="color-btn" data-color="#2196F3" style="--c:#2196F3"></button>
        <button class="color-btn" data-color="#FF5722" style="--c:#FF5722"></button>
        <button class="color-btn" data-color="#E91E63" style="--c:#E91E63"></button>
        <button class="color-btn" data-color="#FFC107" style="--c:#FFC107"></button>
        <button class="action-btn" id="randomBtn" title="Случайный куб">🎲</button>
        <button class="action-btn" id="clearBtn" title="Очистить">🗑️</button>
    </div>

    <button id="startBtn">📷 Включить камеру</button>

    <div id="log"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const video = document.getElementById('video');
        const canvas = document.getElementById('scene');
        const startBtn = document.getElementById('startBtn');
        const logEl = document.getElementById('log');
        const toolbar = document.getElementById('toolbar');
        const topBar = document.getElementById('topBar');
        const hintEl = document.getElementById('hint');

        function log(msg, cls = '') {
            const line = document.createElement('div');
            if (cls) line.className = cls;
            line.textContent = msg;
            logEl.appendChild(line);
            logEl.classList.add('visible');
            logEl.scrollTop = logEl.scrollHeight;
            console.log(msg);
        }

        function showHint(text) {
            hintEl.textContent = text;
            hintEl.classList.add('visible');
            setTimeout(() => hintEl.classList.remove('visible'), 5000);
        }

        // ==== THREE.JS СЦЕНА ====
        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            alpha: true,
            antialias: true
        });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 3;

        // Освещение
        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const light1 = new THREE.DirectionalLight(0xffffff, 1.5);
        light1.position.set(2, 3, 4);
        scene.add(light1);
        const light2 = new THREE.DirectionalLight(0x88ccff, 0.8);
        light2.position.set(-3, -2, 2);
        scene.add(light2);

        // Главный куб, который «висит» перед камерой
        const mainCubeGeo = new THREE.BoxGeometry(1, 1, 1);
        const mainCubeMat = new THREE.MeshStandardMaterial({
            color: 0x4CAF50,
            roughness: 0.3,
            metalness: 0.4
        });
        const mainCube = new THREE.Mesh(mainCubeGeo, mainCubeMat);
        scene.add(mainCube);

        // Обводка (edges)
        const edges = new THREE.EdgesGeometry(mainCubeGeo);
        const line = new THREE.LineSegments(
            edges,
            new THREE.LineBasicMaterial({ color: 0xffffff, linewidth: 2 })
        );
        mainCube.add(line);

        // ============ УПРАВЛЕНИЕ ЖЕСТАМИ ============
        let isDragging = false;
        let prevX = 0, prevY = 0;
        let rotationX = 0, rotationY = 0;
        let scale = 1;
        let lastPinchDist = 0;

        // Позиция куба — в центре экрана «в 3D»
        const cubeTargetPos = new THREE.Vector3(0, 0, 0);

        // ==== ДВИЖЕНИЕ ПАЛЬЦЕМ (вращение) ====
        canvas.style.pointerEvents = 'auto'; // включим после старта камеры

        function onPointerDown(e) {
            if (e.touches && e.touches.length === 2) {
                // Пинч
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                lastPinchDist = Math.hypot(dx, dy);
                isDragging = false;
                return;
            }
            isDragging = true;
            const p = e.touches ? e.touches[0] : e;
            prevX = p.clientX;
            prevY = p.clientY;
        }

        function onPointerMove(e) {
            if (e.touches && e.touches.length === 2) {
                // Пинч — масштаб
                const dx = e.touches[0].clientX - e.touches[1].clientX;
                const dy = e.touches[0].clientY - e.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                if (lastPinchDist > 0) {
                    const delta = dist / lastPinchDist;
                    scale = Math.max(0.3, Math.min(3, scale * delta));
                }
                lastPinchDist = dist;
                return;
            }
            if (!isDragging) return;
            const p = e.touches ? e.touches[0] : e;
            const dx = p.clientX - prevX;
            const dy = p.clientY - prevY;
            rotationY += dx * 0.01;
            rotationX += dy * 0.01;
            // Ограничиваем вращение по X
            rotationX = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, rotationX));
            prevX = p.clientX;
            prevY = p.clientY;
            e.preventDefault();
        }

        function onPointerUp() {
            isDragging = false;
            lastPinchDist = 0;
        }

        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp);
        canvas.addEventListener('touchcancel', onPointerUp);

        // Для мыши (ПК)
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', onPointerUp);
        canvas.addEventListener('wheel', (e) => {
            scale = Math.max(0.3, Math.min(3, scale - e.deltaY * 0.001));
        }, { passive: true });

        // ==== КАМЕРА ====
        let stream = null;
        let facingMode = 'environment'; // задняя по умолчанию

        async function startCamera() {
            try {
                log('Запрос камеры (' + facingMode + ')…');

                if (stream) {
                    stream.getTracks().forEach(t => t.stop());
                }

                stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: { ideal: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                });

                video.srcObject = stream;
                await video.play();

                const track = stream.getVideoTracks()[0];
                const s = track.getSettings();
                log('OK: ' + s.width + 'x' + s.height + ' / ' + (s.facingMode || '?'), 'ok');

                // Показываем интерфейс
                startBtn.style.display = 'none';
                toolbar.classList.add('visible');
                topBar.classList.add('visible');
                canvas.style.pointerEvents = 'auto';
                showHint('Вращай куб пальцем 👆 Масштаб — двумя пальцами 🤏');

                logEl.classList.remove('visible');

            } catch (err) {
                log('ОШИБКА: ' + err.name + ' — ' + err.message, 'err');
                if (err.name === 'NotAllowedError') {
                    log('Разреши доступ к камере в настройках', 'err');
                } else if (err.name === 'NotFoundError') {
                    log('Камера не найдена', 'err');
                } else if (location.protocol !== 'https:' && location.hostname !== 'localhost') {
                    log('Нужен HTTPS! Камера не работает по http://', 'err');
                }
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
                video.srcObject = null;
            }
            startBtn.style.display = 'block';
            toolbar.classList.remove('visible');
            topBar.classList.remove('visible');
            canvas.style.pointerEvents = 'none';
        }

        // ==== КНОПКИ ====
        startBtn.addEventListener('click', startCamera);
        document.getElementById('stopBtn').addEventListener('click', stopCamera);

        document.getElementById('switchCamBtn').addEventListener('click', () => {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            // Сбрасываем куб
            rotationX = 0;
            rotationY = 0;
            scale = 1;
            mainCube.position.set(0, 0, 0);
            cubeTargetPos.set(0, 0, 0);
        });

        document.getElementById('randomBtn').addEventListener('click', () => {
            // Случайный цвет и лёгкое случайное вращение
            const colors = [0x4CAF50, 0x2196F3, 0xFF5722, 0xE91E63, 0xFFC107, 0x9C27B0, 0x00BCD4];
            mainCubeMat.color.setHex(colors[Math.floor(Math.random() * colors.length)]);
            rotationY += Math.PI * 2 * Math.random();
        });

        // Выбор цвета
        document.querySelectorAll('#toolbar .color-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#toolbar .color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const color = btn.dataset.color;
                mainCubeMat.color.set(color);
            });
        });

        // ==== АНИМАЦИЯ ====
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.016;

            // Плавно применяем вращение
            mainCube.rotation.x += (rotationX - mainCube.rotation.x) * 0.15;
            mainCube.rotation.y += (rotationY - mainCube.rotation.y) * 0.15;

            // Плавно масштаб
            mainCube.scale.lerp(new THREE.Vector3(scale, scale, scale), 0.15);

            // Лёгкое «парение» — куб чуть покачивается
            mainCube.position.x = Math.sin(time * 1.5) * 0.05;
            mainCube.position.y = Math.cos(time * 1.2) * 0.05;

            renderer.render(scene, camera);
        }
        animate();

        // Ресайз
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Автостарт? Нет — по кнопке (иначе браузер заблокирует камеру)
    </script>
</body>
</html>
