<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Рисование пальцем в воздухе</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
  body { background: #0a0a1a; font-family: 'Segoe UI', system-ui, sans-serif; overflow: hidden; }
  #app { position: relative; width: 100vw; height: 100vh; }

  /* ВИДЕО зеркалим — чтобы видеть себя как в зеркале */
  video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }

  /* РИСУНОК — БЕЗ зеркала. Координаты уже пересчитаны вручную. */
  #drawCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  /* ОВЕРЛЕЙ (кружки/квадрат) — тоже без зеркала */
  #overlayCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  #status {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.75); color: #fff;
    padding: 10px 22px; border-radius: 40px;
    font-size: 15px; font-weight: 500;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    z-index: 100; text-align: center;
    transition: opacity 0.3s; white-space: nowrap;
  }
  #status.hidden { opacity: 0; }
  #status .highlight { color: #7cff7c; font-weight: 700; }

  .controls {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 100;
    flex-wrap: wrap; justify-content: center;
    padding: 0 10px;
  }
  .controls button {
    padding: 11px 18px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 40px;
    background: rgba(20,20,40,0.8);
    color: #fff;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(12px);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .controls button:hover { background: rgba(60,60,120,0.9); }
  .controls button.active {
    background: #00e5ff; color: #001a22;
    border-color: #00e5ff;
    box-shadow: 0 0 20px rgba(0,229,255,0.6);
  }
  .controls button.clear { background: rgba(220,50,50,0.75); }
  .controls button.clear:hover { background: rgba(255,60,60,0.95); }

  .mode-indicator {
    position: fixed; top: 20px; left: 20px;
    background: rgba(0,0,0,0.7);
    color: #7cff7c;
    padding: 8px 16px; border-radius: 30px;
    font-size: 13px; font-weight: 600;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(124,255,124,0.3);
    z-index: 100;
  }

  @media (max-width: 600px) {
    #status { font-size: 12px; padding: 8px 14px; max-width: 90vw; white-space: normal; }
    .controls button { padding: 9px 13px; font-size: 12px; }
    .mode-indicator { font-size: 11px; padding: 6px 12px; }
  }
</style>
</head>
<body>

<div id="app">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="drawCanvas"></canvas>
  <canvas id="overlayCanvas"></canvas>

  <div id="status">Запрос доступа к камере...</div>
  <div class="mode-indicator" id="modeIndicator">Режим: рисование</div>

  <div class="controls">
    <button id="trackBtn">👋 Отслеживать пальцы</button>
    <button id="squareBtn">⬜ Квадрат</button>
    <button id="clearBtn" class="clear">🗑 Очистить</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>

<script>
(function() {
'use strict';

// ============================================================
// DOM
// ============================================================
const video = document.getElementById('video');
const drawCanvas = document.getElementById('drawCanvas');
const overlayCanvas = document.getElementById('overlayCanvas');
const drawCtx = drawCanvas.getContext('2d');
const overlayCtx = overlayCanvas.getContext('2d');
const statusEl = document.getElementById('status');
const trackBtn = document.getElementById('trackBtn');
const squareBtn = document.getElementById('squareBtn');
const clearBtn = document.getElementById('clearBtn');
const modeIndicator = document.getElementById('modeIndicator');

// ============================================================
// НАСТРОЙКИ
// ============================================================
const SMOOTHING = 0.55;            // 0 = без отставания, 0.9 = сильное
const LINE_WIDTH = 8;
const LINE_COLOR = '#00e5ff';
const GLOW_COLOR = 'rgba(0,229,255,0.4)';

const TRACK_COLOR = '#ff3355';
const TRACK_RADIUS = 12;

const SQUARE_COLOR = '#ffcc00';

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let canvasWidth = 0;
let canvasHeight = 0;
let camera = null;

let mode = 'draw';  // 'draw' | 'track' | 'square'

let isDrawing = false;
let lastPoint = null;

let square = { x: 0, y: 0, w: 0, h: 0, active: false };

// ============================================================
// CANVAS SIZE
// ============================================================
function resizeCanvases() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvasWidth = window.innerWidth;
  canvasHeight = window.innerHeight;

  for (const c of [drawCanvas, overlayCanvas]) {
    c.width = canvasWidth * dpr;
    c.height = canvasHeight * dpr;
    c.style.width = canvasWidth + 'px';
    c.style.height = canvasHeight + 'px';
  }

  drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  overlayCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  setupDrawStyle();
}

function setupDrawStyle() {
  drawCtx.lineCap = 'round';
  drawCtx.lineJoin = 'round';
  drawCtx.lineWidth = LINE_WIDTH;
  drawCtx.strokeStyle = LINE_COLOR;
  drawCtx.shadowColor = GLOW_COLOR;
  drawCtx.shadowBlur = 12;
}

window.addEventListener('resize', () => {
  // сохраняем текущий рисунок
  const snapshot = document.createElement('canvas');
  snapshot.width = drawCanvas.width;
  snapshot.height = drawCanvas.height;
  snapshot.getContext('2d').drawImage(drawCanvas, 0, 0);

  resizeCanvases();

  drawCtx.save();
  drawCtx.setTransform(1, 0, 0, 1, 0, 0);
  drawCtx.drawImage(snapshot, 0, 0);
  drawCtx.restore();
});

// ============================================================
// ОЧИСТКА
// ============================================================
function clearAll() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  drawCtx.save();
  drawCtx.setTransform(1, 0, 0, 1, 0, 0);
  drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
  drawCtx.restore();

  overlayCtx.save();
  overlayCtx.setTransform(1, 0, 0, 1, 0, 0);
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
  overlayCtx.restore();

  lastPoint = null;
  isDrawing = false;
  square.active = false;
}
clearBtn.addEventListener('click', clearAll);

// ============================================================
// СТАТУС
// ============================================================
function setStatus(html, warn = false) {
  statusEl.innerHTML = html;
  statusEl.classList.remove('hidden');
  statusEl.style.color = warn ? '#ffaa33' : '#fff';
}
function hideStatus() { statusEl.classList.add('hidden'); }

function updateModeIndicator() {
  const labels = {
    draw: 'Режим: рисование',
    track: 'Режим: отслеживание пальцев',
    square: 'Режим: квадрат'
  };
  modeIndicator.textContent = labels[mode];
}

// ============================================================
// КНОПКИ
// ============================================================
trackBtn.addEventListener('click', () => {
  mode = (mode === 'track') ? 'draw' : 'track';
  isDrawing = false;
  lastPoint = null;
  square.active = false;

  trackBtn.classList.toggle('active', mode === 'track');
  squareBtn.classList.toggle('active', mode === 'square');

  // Для квадрата нужны 2 руки, для остальных — 1 (быстрее)
  hands.setOptions({ maxNumHands: mode === 'square' ? 2 : 1 });

  updateModeIndicator();
  overlayCtx.clearRect(0, 0, canvasWidth, canvasHeight);

  setStatus(mode === 'track'
    ? '👋 <span class="highlight">Отслеживание</span>: кружки на кончиках пальцев'
    : '✋ Ведите указательным пальцем');
});

squareBtn.addEventListener('click', () => {
  mode = (mode === 'square') ? 'draw' : 'square';
  isDrawing = false;
  lastPoint = null;
  square.active = false;

  squareBtn.classList.toggle('active', mode === 'square');
  trackBtn.classList.toggle('active', mode === 'track');

  // Для квадрата нужны 2 руки, для остальных — 1 (быстрее)
  hands.setOptions({ maxNumHands: mode === 'square' ? 2 : 1 });

  updateModeIndicator();
  overlayCtx.clearRect(0, 0, canvasWidth, canvasHeight);

  setStatus(mode === 'square'
    ? '⬜ <span class="highlight">Квадрат</span>: покажите две руки и разводите указательные пальцы'
    : '✋ Ведите указательным пальцем');
});

// ============================================================
// УТИЛИТЫ
// ============================================================
function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function isIndexExtended(lm) {
  const wrist = lm[0];
  const tip = lm[8];
  const mcp = lm[5];
  return dist(wrist, tip) > dist(wrist, mcp) * 1.15;
}

// ------------------------------------------------------------
// ГЛАВНОЕ: перевод нормализованных координат в пиксели canvas
// ------------------------------------------------------------
// MediaPipe отдаёт координаты в системе ЗЕРКАЛЬНОГО видео (selfie).
// Нормализованный x: 0 = левый край КАДРА камеры.
// Но так как видео на экране отражено scaleX(-1), левый край кадра
// отображается СПРАВА. Значит на экране:
//    screenX = (1 - normX) * width
//
// Это даёт: рука влево → на экране влево → линия влево.
function normToScreen(normX, normY) {
  return {
    x: (1 - normX) * canvasWidth,
    y: normY * canvasHeight
  };
}

// ============================================================
// РЕЖИМ РИСОВАНИЯ
// ============================================================
function drawStroke(from, to) {
  const d = dist(from, to);
  const maxStep = 8;

  drawCtx.beginPath();
  drawCtx.moveTo(from.x, from.y);

  if (d < maxStep) {
    drawCtx.lineTo(to.x, to.y);
  } else {
    const steps = Math.ceil(d / maxStep);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      drawCtx.lineTo(from.x + (to.x - from.x) * t, from.y + (to.y - from.y) * t);
    }
  }
  drawCtx.stroke();
}

function handleDrawMode(handsData) {
  if (handsData.length > 0) {
    const lm = handsData[0];
    if (isIndexExtended(lm)) {
      const raw = normToScreen(lm[8].x, lm[8].y);

      let point;
      if (lastPoint) {
        point = {
          x: lastPoint.x * SMOOTHING + raw.x * (1 - SMOOTHING),
          y: lastPoint.y * SMOOTHING + raw.y * (1 - SMOOTHING)
        };
      } else {
        point = raw;
        // Начальная точка
        drawCtx.beginPath();
        drawCtx.arc(point.x, point.y, LINE_WIDTH / 2, 0, Math.PI * 2);
        drawCtx.fillStyle = LINE_COLOR;
        drawCtx.fill();
      }

      if (isDrawing && lastPoint) {
        drawStroke(lastPoint, point);
      }

      isDrawing = true;
      lastPoint = point;
    } else {
      isDrawing = false;
      lastPoint = null;
    }
  } else {
    isDrawing = false;
    lastPoint = null;
  }
}

// ============================================================
// РЕЖИМ ОТСЛЕЖИВАНИЯ ПАЛЬЦЕВ
// ============================================================
const TIP_INDICES = [4, 8, 12, 16, 20];
const KNUCKLE_INDICES = [0, 5, 9, 13, 17];

function drawTrackingOverlay(handsData) {
  overlayCtx.clearRect(0, 0, canvasWidth, canvasHeight);

  overlayCtx.save();
  overlayCtx.shadowBlur = 16;

  for (const lm of handsData) {
    // Кончики — крупные красные
    overlayCtx.fillStyle = TRACK_COLOR;
    overlayCtx.shadowColor = 'rgba(255,51,85,0.7)';
    for (const idx of TIP_INDICES) {
      const p = normToScreen(lm[idx].x, lm[idx].y);
      overlayCtx.beginPath();
      overlayCtx.arc(p.x, p.y, TRACK_RADIUS, 0, Math.PI * 2);
      overlayCtx.fill();
    }

    // Основания/запястье — белые поменьше
    overlayCtx.fillStyle = 'rgba(255,255,255,0.95)';
    overlayCtx.shadowColor = 'rgba(255,255,255,0.6)';
    for (const idx of KNUCKLE_INDICES) {
      const p = normToScreen(lm[idx].x, lm[idx].y);
      overlayCtx.beginPath();
      overlayCtx.arc(p.x, p.y, TRACK_RADIUS * 0.55, 0, Math.PI * 2);
      overlayCtx.fill();
    }
  }

  overlayCtx.restore();
}

// ============================================================
// РЕЖИМ КВАДРАТА
// ============================================================
function drawSquareOverlay(handsData) {
  overlayCtx.clearRect(0, 0, canvasWidth, canvasHeight);

  let x1, y1, x2, y2;

  if (handsData.length >= 2) {
    // Две руки: указательные пальцы — противоположные углы
    const a = normToScreen(handsData[0][8].x, handsData[0][8].y);
    const b = normToScreen(handsData[1][8].x, handsData[1][8].y);
    x1 = a.x; y1 = a.y;
    x2 = b.x; y2 = b.y;
    square.active = true;
  } else if (handsData.length === 1) {
    // Одна рука: указательный палец — угол, второй угол растёт от центра ладони
    const tip = normToScreen(handsData[0][8].x, handsData[0][8].y);
    const palm = normToScreen(handsData[0][9].x, handsData[0][9].y);
    x1 = tip.x; y1 = tip.y;
    x2 = palm.x + (palm.x - tip.x) * 1.5;
    y2 = palm.y + (palm.y - tip.y) * 1.5;
    square.active = true;
  } else {
    // Рук нет — квадрат остаётся на месте
    if (square.active) drawSquareShape(square.x, square.y, square.w, square.h);
    return;
  }

  const left = Math.min(x1, x2);
  const top = Math.min(y1, y2);
  const w = Math.abs(x2 - x1);
  const h = Math.abs(y2 - y1);

  square.x = left;
  square.y = top;
  square.w = w;
  square.h = h;

  drawSquareShape(left, top, w, h);
}

function drawSquareShape(left, top, w, h) {
  overlayCtx.save();
  overlayCtx.shadowColor = 'rgba(255,204,0,0.7)';
  overlayCtx.shadowBlur = 20;

  // Заливка
  overlayCtx.fillStyle = 'rgba(255,204,0,0.15)';
  overlayCtx.fillRect(left, top, w, h);

  // Контур
  overlayCtx.strokeStyle = SQUARE_COLOR;
  overlayCtx.lineWidth = 5;
  overlayCtx.strokeRect(left, top, w, h);

  // Уголки
  overlayCtx.fillStyle = SQUARE_COLOR;
  const corners = [
    [left, top],
    [left + w, top],
    [left, top + h],
    [left + w, top + h]
  ];
  for (const [cx, cy] of corners) {
    overlayCtx.beginPath();
    overlayCtx.arc(cx, cy, 9, 0, Math.PI * 2);
    overlayCtx.fill();
  }

  // Размер
  overlayCtx.shadowBlur = 0;
  overlayCtx.fillStyle = '#fff';
  overlayCtx.font = 'bold 14px sans-serif';
  overlayCtx.textAlign = 'center';
  overlayCtx.fillText(`${Math.round(w)} × ${Math.round(h)}`, left + w / 2, top - 12);

  overlayCtx.restore();
}

// ============================================================
// ГЛАВНЫЙ ОБРАБОТЧИК
// ============================================================
function onResults(results) {
  const handsData = results.multiHandLandmarks || [];

  if (mode === 'draw') {
    handleDrawMode(handsData);
    overlayCtx.clearRect(0, 0, canvasWidth, canvasHeight);
  } else if (mode === 'track') {
    drawTrackingOverlay(handsData);
  } else if (mode === 'square') {
    drawSquareOverlay(handsData);
  }
}

// ============================================================
// MEDIAPIPE
// ============================================================
const hands = new Hands({
  locateFile: (file) =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
});

hands.setOptions({
  maxNumHands: 1,
  modelComplexity: 0,          // 0 = быстрая модель (меньше лагов)
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6,
  selfieMode: false,
});

hands.onResults(onResults);

// ============================================================
// КАМЕРА
// ============================================================
async function startCamera() {
  try {
    setStatus('⏳ Запрос доступа к камере...');

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error('Браузер не поддерживает доступ к камере');
    }

    const stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width:  { ideal: 640 },     // меньше разрешение = меньше лагов
        height: { ideal: 480 },
        frameRate: { ideal: 30 }
      },
      audio: false
    });

    video.srcObject = stream;
    await new Promise(r => {
      video.onloadedmetadata = () => video.play().then(r).catch(r);
    });

    resizeCanvases();

    setStatus('✋ <span class="highlight">Ведите указательным пальцем</span>');

    camera = new Camera(video, {
      onFrame: async () => { await hands.send({ image: video }); },
      width: 640,
      height: 480,
    });
    await camera.start();

    setTimeout(hideStatus, 4000);

  } catch (err) {
    console.error(err);
    let msg = '❌ Не удалось получить доступ к камере.';
    if (err.name === 'NotAllowedError') msg = '🚫 Доступ запрещён. Разрешите камеру и обновите страницу.';
    else if (err.name === 'NotFoundError') msg = '📷 Камера не найдена.';
    else if (err.name === 'NotReadableError') msg = '⚠️ Камера занята другим приложением.';
    else if (err.message) msg = '❌ ' + err.message;
    setStatus(msg, true);
  }
}

window.addEventListener('load', () => {
  if (typeof Hands === 'undefined' || typeof Camera === 'undefined') {
    setStatus('❌ Ошибка загрузки MediaPipe. Проверьте интернет.', true);
    return;
  }
  resizeCanvases();
  updateModeIndicator();
  startCamera();
});

})();
</script>

</body>
</html>
