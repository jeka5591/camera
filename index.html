<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Комната — 3D кубы</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            background: #000;
            color: white;
        }
        #ar-button {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(76, 175, 80, 0.5);
            z-index: 999;
            transition: all 0.3s;
        }
        #ar-button:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 12px 32px rgba(76, 175, 80, 0.7);
        }
        #ar-button:active { transform: translateX(-50%) scale(0.95); }

        #info {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 999;
            text-align: center;
            max-width: 90%;
        }

        #controls {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 10px;
            z-index: 999;
            flex-wrap: wrap;
            justify-content: center;
        }

        #controls button {
            padding: 12px 20px;
            font-size: 14px;
            border: none;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        #controls button.active {
            background: rgba(76, 175, 80, 0.9);
            border-color: #4CAF50;
        }

        #not-supported {
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
            z-index: 1000;
        }
        #not-supported h2 { margin-bottom: 20px; color: #f44336; }
        #not-supported p { margin-bottom: 10px; line-height: 1.6; max-width: 500px; }

        #reticle {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 40px;
            height: 40px;
            margin: -20px 0 0 -20px;
            border: 3px solid white;
            border-radius: 50%;
            pointer-events: none;
            display: none;
            z-index: 998;
            opacity: 0.7;
        }

        #reticle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            background: white;
            border-radius: 50%;
        }

        .color-dot {
            display: inline-block;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div id="info">Нажмите кнопку, чтобы начать AR</div>

    <div id="reticle"></div>

    <div id="controls">
        <button data-color="0x4CAF50" class="active"><span class="color-dot" style="background:#4CAF50"></span>Зелёный</button>
        <button data-color="0x2196F3"><span class="color-dot" style="background:#2196F3"></span>Синий</button>
        <button data-color="0xFF5722"><span class="color-dot" style="background:#FF5722"></span>Оранжевый</button>
        <button data-color="0xE91E63"><span class="color-dot" style="background:#E91E63"></span>Розовый</button>
        <button id="clear-btn">🗑️ Очистить</button>
    </div>

    <button id="ar-button">🚀 Начать AR</button>

    <div id="not-supported" style="display:none">
        <h2>😕 WebXR не поддерживается</h2>
        <p>Ваш браузер или устройство не поддерживает AR.</p>
        <p><b>Что нужно:</b></p>
        <p>📱 Android + Chrome (последняя версия)</p>
        <p>📱 iOS 17+ — WebXR работает частично</p>
        <p>💻 На ПК нужен WebXR эмулятор или VR-шлем</p>
        <p style="margin-top:20px;opacity:0.7">На ПК можно попробовать через расширение WebXR API Emulator</p>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';

        // ============ ПРОВЕРКА ПОДДЕРЖКИ ============
        const infoEl = document.getElementById('info');
        const arButtonEl = document.getElementById('ar-button');
        const controlsEl = document.getElementById('controls');
        const reticleEl = document.getElementById('reticle');
        const notSupported = document.getElementById('not-supported');

        if (!navigator.xr) {
            notSupported.style.display = 'flex';
            arButtonEl.style.display = 'none';
        } else {
            navigator.xr.isSessionSupported('immersive-ar').then(supported => {
                if (!supported) {
                    notSupported.style.display = 'flex';
                    arButtonEl.style.display = 'none';
                }
            });
        }

        // ============ ОСНОВНЫЕ ОБЪЕКТЫ ============
        let renderer, scene, camera;
        let reticle, hitTestSource = null, hitTestSourceRequested = false;
        let currentColor = 0x4CAF50;
        const cubes = [];

        init();

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            // Освещение
            const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(1, 2, 1);
            scene.add(dirLight);

            // Рендерер
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Прицел (куда ставить куб)
            reticle = new THREE.Mesh(
                new THREE.RingGeometry(0.08, 0.10, 32).rotateX(-Math.PI / 2),
                new THREE.MeshBasicMaterial({ color: 0xffffff })
            );
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // AR-кнопка от Three.js
            const arButton = ARButton.createButton(renderer, {
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            });
            arButton.style.display = 'none'; // скрываем, у нас своя
            arButton.id = 'three-ar-button';
            document.body.appendChild(arButton);

            // Своя кнопка → кликаем по Three.js-кнопке
            arButtonEl.addEventListener('click', () => {
                document.getElementById('three-ar-button').click();
            });

            // События сессии
            renderer.xr.addEventListener('sessionstart', onSessionStart);
            renderer.xr.addEventListener('sessionend', onSessionEnd);

            // Клик по экрану — спавн куба
            renderer.domElement.addEventListener('click', onScreenClick);
            // Для мобильных — touch
            renderer.domElement.addEventListener('touchend', onScreenClick);

            renderer.setAnimationLoop(render);
        }

        // ============ СТАРТ/КОНЕЦ AR ============
        function onSessionStart() {
            infoEl.textContent = 'Наведите на поверхность и тапните, чтобы поставить куб';
            arButtonEl.style.display = 'none';
            controlsEl.style.display = 'flex';
            reticleEl.style.display = 'block';

            // показываем кнопки Three.js внизу скрываем
            const threeBtn = document.getElementById('three-ar-button');
            if (threeBtn) threeBtn.style.display = 'none';

            // прячем нашу AR-кнопку
            arButtonEl.style.display = 'none';
        }

        function onSessionEnd() {
            infoEl.textContent = 'Нажмите кнопку, чтобы начать AR';
            arButtonEl.style.display = 'block';
            controlsEl.style.display = 'none';
            reticleEl.style.display = 'none';
            reticle.visible = false;

            // очищаем кубы
            cubes.forEach(c => scene.remove(c));
            cubes.length = 0;

            hitTestSource = null;
            hitTestSourceRequested = false;
        }

        // ============ HIT-TEST (поиск поверхностей) ============
        function onScreenClick(event) {
            if (reticle.visible && renderer.xr.isPresenting) {
                spawnCube(reticle.matrix);
                // вибро-отклик если есть
                if (navigator.vibrate) navigator.vibrate(30);
            }
        }

        // ============ СПАВН КУБА ============
        function spawnCube(matrix) {
            const size = 0.1 + Math.random() * 0.1; // 10-20 см
            const geometry = new THREE.BoxGeometry(size, size, size);
            const material = new THREE.MeshStandardMaterial({
                color: currentColor,
                roughness: 0.4,
                metalness: 0.1
            });
            const cube = new THREE.Mesh(geometry, material);

            // Позиция из матрицы hit-test
            const position = new THREE.Vector3();
            const rotation = new THREE.Quaternion();
            const scale = new THREE.Vector3();
            matrix.decompose(position, rotation, scale);

            // Немного приподнимаем, чтобы куб стоял на поверхности
            position.y += size / 2;

            cube.position.copy(position);
            // Случайное вращение вокруг вертикальной оси
            cube.rotation.y = Math.random() * Math.PI * 2;

            // Немного анимации — плавное появление
            cube.scale.set(0.01, 0.01, 0.01);

            scene.add(cube);
            cubes.push(cube);
        }

        // ============ АНИМАЦИЯ ПОЯВЛЕНИЯ ============
        function animateCubes() {
            cubes.forEach(cube => {
                const s = cube.scale.x;
                if (s < 1) {
                    const newScale = Math.min(1, s + 0.1);
                    cube.scale.set(newScale, newScale, newScale);
                } else {
                    // легкое вращение
                    cube.rotation.y += 0.003;
                }
            });
        }

        // ============ RENDER LOOP ============
        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // Запрашиваем hit-test source один раз
                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then((viewerSpace) => {
                        session.requestHitTestSource({ space: viewerSpace }).then((source) => {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', () => {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                // Обновляем позицию прицела
                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length) {
                        const hit = hitTestResults[0];
                        const pose = hit.getPose(referenceSpace);
                        if (pose) {
                            reticle.visible = true;
                            reticle.matrix.fromArray(pose.transform.matrix);
                        }
                    } else {
                        reticle.visible = false;
                    }
                }
            }

            animateCubes();
            renderer.render(scene, camera);
        }

        // ============ UI — ВЫБОР ЦВЕТА ============
        document.querySelectorAll('#controls button[data-color]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('#controls button[data-color]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentColor = parseInt(btn.dataset.color);
            });
        });

        // Очистить всё
        document.getElementById('clear-btn').addEventListener('click', () => {
            cubes.forEach(c => scene.remove(c));
            cubes.length = 0;
        });

        // ============ RESIZE ============
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
